<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <title>Web小説ポータル</title>

  <style>
    :root { --bg:#0f1320; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; }
    html, body { margin:0; background:var(--bg); color:var(--ink);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }

    .wrap { max-width: 820px; margin: 0 auto; padding: 18px 14px 24px; }

    header { margin-bottom: 12px; text-align:center; }
    header h1 { margin:0 0 6px; font-size:1.3rem; }
    header p { margin:0; color:var(--muted); font-size:.9rem; }

    .panel {
      background: linear-gradient(180deg, #1a1f33, #151a2a);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
    }
    .panel + .panel { margin-top: 12px; }
    .section-title { font-size:1rem; margin-bottom:8px; color:var(--muted); }
    .list { display:flex; flex-direction:column; gap:6px; }

    .btn {
      display:block;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#11162a;
      color:var(--ink);
      text-decoration:none;
      font-size:.95rem;
    }
    .btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(110,168,254,.15) inset;
    }
    .desc { font-size:.85rem; color:var(--muted); margin-left:4px; }

    footer { margin-top:16px; text-align:center; font-size:.8rem; color:var(--muted); }
    footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
