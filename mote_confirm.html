<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="48x48" href="image/favicon-48.png">
  <title>閲覧前の確認</title>

  <style>
    :root { --bg:#0f1320; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; }
    html, body { margin:0; background:var(--bg); color:var(--ink);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 24px; }

    header { text-align:center; margin-bottom:10px; }
    header h1 { margin:0; font-size:1.2rem; }

    .panel {
      background: linear-gradient(180deg, #1a1f33, #151a2a);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
      text-align:center;
    }
    .panel + .panel { margin-top:10px; }
    .msg {
      line-height:1.8;
      white-space: pre-wrap;
      color:var(--muted);
      font-size: .95rem;
    }
    .art { margin: 10px 0; display:flex; justify-content:center; }
    .art img {
      max-width:100%;
      max-height:300px;
      border-radius:10px;
      border:1px solid var(--border);
    }
    .nav {
      display:flex;
      gap:8px;
      justify-content:space-between;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .btn {
      flex:1;
      text-align:center;
      padding:10px;
      border:1px solid var(--border);
      border-radius:999px;
      background:#11162a;
      color:var(--ink);
      text-decoration:none;
      font-size:.95rem;
    }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,168,254,.15) inset; }
  </style>
</head>
<body>

<!-- ===== 編集ここだけ ===== -->
<script>
  const META = {
    title: '閲覧前の確認',
    message: `この巡り灯エピソードは、
『境界のミレイ ―Mirei on the Edge― 』の
「正史エンド」および「アナザーエンド」の読了後に
読むことを推奨します。

未読の場合、一部の展開や人物関係が理解できません。`,

    image: '../assets/warning.jpg', // 不要なら null

    okHref: 'mote2nd_index.html',   // 進む先
    cancelHref: 'mote_index.html',  // 戻る先
  };
</script>

<div class="wrap">

  <header>
    <h1 id="title"></h1>
  </header>

  <section class="panel">
    <div class="msg" id="msg"></div>
  </section>

  <section class="panel" id="image-wrap" style="display:none">
    <div class="art" id="art"></div>
  </section>

  <div class="nav">
    <a id="cancel" class="btn">戻る</a>
    <a id="ok" class="btn">読む</a>
  </div>

</div>

<script>
(function init(){
  document.getElementById('title').textContent = META.title;
  document.getElementById('msg').textContent = META.message;

  // 画像
  if (META.image) {
    const wrap = document.getElementById('image-wrap');
    const art = document.getElementById('art');
    wrap.style.display = '';
    art.innerHTML = `<img src="${META.image}" alt="">`;
  }

  // リンク
  document.getElementById('ok').href = META.okHref;
  document.getElementById('cancel').href = META.cancelHref;
})();
</script>

</body>
</html>
