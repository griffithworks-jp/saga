  <style>
/*    :root { --bg:#0f1320; --card:#171b2a; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; } */
    :root { --bg:#0b0b0d; --card:#171b2a; --ink:#ececec; --muted:#9a9a9f; --border:#26262d; --accent:#8ab4ff; }
    html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
    header { padding:20px 16px 8px; text-align:center; }
    header h1 { margin:0 0 6px; font-weight:800; letter-spacing:.02em; font-size:1.25rem; }
    header p { margin:0; color:var(--muted); font-size:.92rem; }
    footer p { margin:0; color:var(--muted); font-size:.92rem; }

    .site-header { margin-bottom: 14px; text-align: center; }
    .page-label { font-size: 0.7rem; letter-spacing: 0.25em; color: var(--muted); margin-bottom: 2px; }
    .novel-title { margin: 0; font-size: 1.3rem; letter-spacing: 0.06em; }
    .catch { margin: 6px 0 8px; font-size: 0.85rem; color: var(--muted); line-height: 1.7; }
    .header-nav { font-size: 0.85rem; }
    .header-nav a { color: var(--accent); text-decoration: none; }
    .header-nav a:hover { text-decoration: underline; }
    .sep { margin: 0 6px; color: var(--muted); }

    .wrap { max-width:980px; margin:0 auto; padding:14px; display:grid; gap:16px; }

    .block { background:linear-gradient(180deg,#1a1f33,#151a2a); border:1px solid var(--border); border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.35); }
    .block h2 { margin:0; padding:12px 14px; border-bottom:1px solid var(--border); font-size:1rem; }
    .block .body { padding:12px 14px; }

    /* episode list */
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; }
    thead th { position:sticky; top:0; background:#151a2a; z-index:1; }
    tr:hover td { background:rgba(110,168,254,.06); }
    a.row { display:block; color:inherit; text-decoration:none; }

    /* layout for split (4th part) */
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:900px){ .grid-2 { grid-template-columns:1fr; } }

    /* scroll containers */
    .scroll { max-height:calc(100vh - 240px); overflow:auto; }
    @media (max-width:900px){ .scroll { max-height:42vh; } }

    .pill { display:inline-block; font-size:.75rem; color:#b9c3ff; background:#11162a; border:1px solid var(--border); padding:2px 6px; border-radius:999px; margin-left:6px; }
  </style>
</head>

    // --- レンダラ ---
    function renderTable(container, list) {
      const wrap = document.getElementById(container);
      if (!wrap) return;
      wrap.innerHTML = '';
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th style="width:22%">#</th><th>タイトル</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      list.forEach(ep => {
        const tr = document.createElement('tr');
        const href = `scenes/${ep.id}.html`;
        tr.innerHTML = `<td>${ep.no}</td><td><a class="row" href="${href}"><strong>${escapeHtml(ep.title)}</strong></a></td>`;
        tbody.appendChild(tr);
      });
      wrap.appendChild(table);
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }

    // --- グルーピング ---
