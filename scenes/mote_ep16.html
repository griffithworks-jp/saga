      { type: 'text', content: `
魔物の骸が静かに水に沈んでいく。

クラウスは剣を納め、光源灯〈マジック・ランタン〉を掲げ直した。
青白い光が洞窟の奥を照らし、濡れた岩肌が鈍く反射する。

「……行きましょうか。まだ先はあります」

「……ああ」

ミレイも小さくうなずいて、再び歩を進める。

並ぶには狭すぎる通路。
自然とクラウスが先を歩き、ミレイが少し後ろからついていく形になった。
足元には溜まった潮水、天井からは時折、水滴がぽたりと落ちる。

しばらく沈黙の中を歩いたあと、クラウスがふと前を向いたまま口を開いた。

「……あの、失礼を承知で言いますが」

ミレイは無言のまま歩きながら、ほんのわずかに眉を寄せた。

「自分、最初はもっと……公子殿って、熊みたいな大男だと思ってたんです。
　正直なところ」

意図せぬ軽口だった。
空気を和らげようとしたのかもしれない。

ミレイは、歩を止めかけたが――そのまま進み続けた。

「熊か……」

短く返す。

その声音は、冗談を受け流すように冷ややかだったが、
クラウスには聞こえなかったかのように、また前を向いて歩いた。

その背を見つめながら、ミレイは目を伏せる。

（……その“熊”が、本物の“公子”だったんだろう）

噂に流された虚像。
学苑で作られた、誰も見たことのない英雄像。
自分は――ただ、その“代わり”に過ぎない。

ふと、足元に目を落とす。

外套の裾が揺れ、濡れた地面の反射に、自分の細い影が映っていた。

（なら……この姿を見た時、内心、違和感くらいは覚えただろうな）

袖の下――華奢な手首。
軽く握ってみても、拳に重みはない。

（……鍛えたら、筋肉って、つくのか？　この身体）

静かに、前を歩くクラウスの背を見上げた。
そして、いつものように、仮面の口調で言った。

「……その噂の出どころに、文句でも言っておいてくれ」

「……はい？」

クラウスは振り返ったが、ミレイはそれ以上続けない。
代わりに口を開く。

「実際、私と会う前。
　どこまで、私のことを知っていましたか？」

クラウスは首をかしげたが、驚いた様子はない。
ただ、どこから話そうかと記憶を辿るような表情を浮かべていた。

「ガリヤ公爵閣下、側近の方から伝えられた情報のみですが……」

言い淀みながら、彼は淡々と続けた。

「公爵閣下、唯一の御子息。
　三年間、国外の学舎へ渡って武芸と学問を修められ、御家に戻られると。
　さっき言ったとおり、学舎において大変優秀でおられたとか」

「……なるほど。その程度のことまでしか？」

「ええ、それだけです」

ミレイは前方のクラウスの背を見つめながら、ほんの一瞬だけ目を伏せた。

（むしろ……ありがたい）

誰も、その“御子息”の素顔を知らない。
だったら、自分が成り切ればいい。

（自分は、その“御子息”とやらではないのだから）

だが、言葉にできない不安が、胸の奥に居座っていた。

もし――どこかで失態を演じたら。
歩き方ひとつ、言葉の抑揚ひとつで、すべてが露見する気がしてならなかった。

失敗はできない。
“誰か”として完璧に振る舞わなければならない。

動作、思考、言葉遣い、息づかい。
表層だけでなく、深部まで、その人物に同化しなければ。

そのためにも――

（……相手のことだって、もっと知らなくては）

ミレイは歩きながら、視線を少しだけ前にやった。

（この男……流派をきちんと叩き込まれている）

戦いの最中に見えた剣の扱い。
踏み込みは正確で、剣筋に無駄がなかった。

「……ところで、きみは剣の扱いに慣れているようですが」

クラウスはわずかに振り返り、すぐに前へ視線を戻した。

「我が家系の男子は、代々剣士でした。
　こと剣に関しては、自信があります」

淡々とした声が、洞窟に吸い込まれていく。
クラウスはそこで言葉を切り、わずかに間を置いた。

「……しかし」

視線が、ほんの一瞬だけ落ちる。

「いえ。なんでもありません……」

それだけ言って、彼は歩みを進める。

やがて、湿り気を帯びた冷たさが薄れ、岩肌のざらついた感触が増してくる。
石の通路は緩やかに広がり、天井も高くなってきた。

そして、海の下にいることも、ふと忘れそうになるような、静かに開けた空間に出る。
その壁には煤の跡が残り、岩陰には古い焚き火の痕。

かつて人が留まった名残が、かすかに漂っている。
ミレイが辺りを見渡していると、クラウスがわずかに足を止めた。

「……できれば、一夜のうちに抜けきりたかったのですが」

天井を見上げるようにして呟き、すぐに振り返る。

「……貴方の体力では、少しペースを落とす必要がありそうです」

ミレイの足が止まる。

否定の余地はなかった。
剣の重さも、長時間の歩行も、すでに身体に響いている。
それを悟られぬよう、気を張り続けていただけだ。

クラウスは続けた。

「このあたりなら、魔物もそう多くはありません。
　空気が動いている。火も使える地形です。
　……少し休んでから進みましょう」

光源灯を岩壁に掛けて明るさを調整する彼の背を、ミレイは無言で見つめた。
気づけば指先に込めていた力を、そっと抜く。
一度、深く息を整えてから、なるべく冷静な声で答える。

「……了解した。判断に異論はない」

ミレイは何事もなかったように、荷と腰を下した。

＊

岩の隙間に、古びた木箱の残骸が見えた。
裂けた板、縄の切れ端、錆びついた釘の跡。
ここがかつて“使われた道”だったことを、雄弁に物語っている。

クラウスは岩陰に残されていた乾いた薪を集め、
火打ち石を打ち鳴らした。

*かち、かち……*

小さな火花が散り、やがて赤い火種が生まれる。
慎重に息を吹き込むと、炎がゆっくりと立ち上がった。

焚火が形になる頃に術具の光は絞られ、洞窟の闇は火の揺らぎに譲られた。

湿った空気が残る洞窟の中、この小さな広間だけは、かろうじて乾いている。

ミレイは、焚火を挟んで向かいに腰を下ろしていた。
外套の裾を膝にかける。

クラウスは剣を脇に置いたまま、焚火の向こうで静かに息を整えていた。

しばらく、火のはぜる音だけが響く。
やがて、ミレイが口を開いた。

「……きみのことを、まだちゃんと聞けてない」

焚火が、ぱちりとはぜる。
クラウスが顔をわずかに上げた。

「さっきの『しかし』が、気になっていた。
　どんな生まれで、なぜ今ここにいるのか。
　知っておきたいと思って」

それは命令でも、詮索でもない。
同行者としての、ただの確認――
そう聞こえるように、意識して選んだつもりの言葉。

だが――クラウスの瞳が、ゆっくりと曇っていくのが見えた。

「クラウス・バウル。
　そう名乗っています。
　……かつて、ロネイルという家に生まれました」

火が揺れた。
ミレイは、その名を聞き逃さなかった。

「剣士の家系、と言っていたな。
　つまりロネイル家というのは……武家か」

口調は穏やかだった。
だが、その一言が――空気を切り裂いた。

「――白々しい……！」

抑えた声だったが、怒気は隠しきれていない。

「貴方が“ガリヤ公爵の血”を引く人間なら、
　ロネイルを知らないはずがない……！」

クラウスの言葉は、はぜた焚火の音と交錯して洞窟に反響した。
ミレイはわずかに眉を動かしたが、それ以上表情を崩さない。

クラウスは顔をそむけたまま、続けた。
その声には、静かな怒りと、滲む苦味があった。

「俺の父は、ガリヤ公爵と同じ軍にいた。
　……九年前の異教徒征伐で」

火がぱちりと鳴る。
洞窟の湿気の中、その音だけが乾いている。

「遠征の戦況が悪化すると、あの男は……自分の軍を退いた。
　父の部隊を見捨てて。
　結果、ロネイル卿は戦死。
　ガリヤ家は、戦後すぐにうちの家を“統治”という名で吸収した」

ミレイは言葉を差し挟まなかった。
ただ、彼の語る“父の死”を、仮面の奥で受け止めていた。

「実質は取り潰しだ。
　……兄たちは異国に送られ、三人いた兄弟は散り散りになった。
　唯一の肉親を失い、ロネイルの名は記録から消えた。
　そして残った俺は――そのガリヤ家に仕えるよう命じられた」

ミレイは、思わず拳を握っていた。
それは怒りではない。
自分の“仮面”が、その憎悪の対象であることへの震えだった。

「親を見殺しにしたも同然の老人に仕えねばならない。
　こんな仕打ち。
　屈辱だった。……今でも、そう思ってる。
　だが、それでもあのときの俺はそうするしかなかった。
　戦で親を失った子供の行き場なんて、限られてる」

言いながら、脇の剣にそっと手を添える。

「あなたも……俺をただの付き人くらいに思っているのかもしれないが。
　今はこんな身でも、俺とて元は剣士の家系。
　術士が相手なら――距離次第で、どうとでもなる」

言葉の一つ一つが鋭い。
感情が近すぎた。

本来なら、口にすべきことではない。
自分が仕えるべき相手だ。
それでも胸の奥に積もっていたものが、抑えきれなかった。

しばしの沈黙をおいて、彼はふっと苦笑した。

「まあ……今さら、こんなこと言われても困るでしょうが」

自分の言葉を、自分で取り繕うような笑みだった。

ミレイは、すぐに答えることができなかった。

自分が“その血”を背負う者として振る舞っている以上、何を言っても、すべては偽りのままだ。
それでも――何かを返すべきだと思った。

「……そうか」

焚火の光に照らされたミレイの横顔は、感情の起伏をほとんど感じさせなかった。
声も、驚くほど静かだった。

「私は、本当に知らなかった」

仮面として返した言葉だった。
それでも、その声には抑えきれない何かが混じってしまった気がした。

（……それで、済むのか）

クラウスの拳に力がこもる。
焚火の影が、彼の表情に揺れて落ちた。

「……その言葉に、どれほどの意味がある」

低い声だった。

「あなたは、“あの男”の血を引いているんでしょう？」

ミレイの瞳が、わずかに揺れる。

「その決断が、どれだけの人間を押しつぶしたか知っていたはずだ」

「……知らない」

その声は、遮るような強さではなく、
それでも――明確だった。

「私は、戦のことも、その話も……何も聞かされていない」

沈黙。
焚火が、ぱち、と小さくはぜた。

クラウスは、視線をミレイから外す。

「……なら、せめて知ってください」

焚火がまた小さくはぜる。

「俺が語ったことを。
　今ここで、確かに聞いたという事実を、覚えていてください」

その口調には、もはや怒気はなかった。
けれど、言葉の芯には、痛みと、重みが残っていた。

ミレイは黙ってうなずいた。
表情は仮面のまま。
それでも、焚火の影が彼女の頬に揺れるたび、
その奥で何かが揺れていることだけは、伝わっていた。

「……進む道を、間違えないでください。公子殿」

その呼び方が、妙に重く響いた。
皮肉か、忠告か、あるいは――警告か。

ミレイは答えなかった。
ただ、火を見つめていた。

（……この仮面では、きっと何も届かない）

炎の揺らめきが、ふたりの影を長く伸ばす。
その間にあるのは、まだ理解とは呼べないもの。

＊

焚火は、いつの間にかほとんど燃え尽きていた。
崩れた薪の隙間からは、赤い炭火が名残のようにかすかに瞬いている。

ミレイは黙ったまま、その火をじっと見つめていた。
さきほど交わされた言葉たち――
どれもまだ、胸の内で熱を持ったまま、冷めきっていなかった。

やがて、洞窟の奥からひんやりとした風が吹き込んだ。
夜明けの冷気だ。
遠く、潮の満ち引きに合わせるように、空気がわずかに動いている。

クラウスが、ゆっくりと立ち上がる。
手慣れた手つきで装備を整え、剣を腰に収める。

「……そろそろ、潮が戻り始める」

焚火の残りに水を数滴落とす。
じゅっという音とともに、小さな湯気が立ちのぼった。

「では、抜け道を急ぎましょう。
　ここを出れば、ルニアまではもうすぐです」

ミレイは顔を上げ、静かにうなずく。

「……分かった」

短い応答。
ふたりの間で、昨夜の話題に触れる者はもういなかった。

＊

通路を進む足音が、かつてより静かに重なる。
背を向け合うこともなく、振り返ることもなく。
ただ前を向いて、光を目指して歩く。

青白い灯が、湿った岩の壁を淡く照らす。
そしてその先には地上の光が、わずかに差し始めていた。

          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
</body>
</html>
