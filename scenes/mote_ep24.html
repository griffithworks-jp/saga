      { type: 'text', content: `
ミレイとクラウスがたどり着いたのは、往路にも立ち寄った港町“ティアル”。
この町は各地と中央を結ぶ交通の要衝で、商人や旅人、さまざまな土地の人々が行き交い賑わう。

──港の午前、市場通りにて。

潮の匂いと焼き魚の香ばしさが入り混じる昼下がり。
雑踏を抜けた水辺沿い。

低い石塀が並ぶ木陰に、クラウスとミレイは腰を下ろしていた。
その脇を人々が行き交う様子を眺めながら、ふたりは道沿いの屋台で買った串焼き魚と薄焼き、それに葡萄水を手にしている。

「……結局、港の管理局に行ってみたけどさ。
　大型船は全部出払ってたよ。
　貨物船の空き待ちなら、最短でも三日はかかるってさ」

クラウスはライ麦パンを齧りながら葡萄水を一口含み、苦笑混じりに言った。
ミレイはフードを下ろし、陽に透ける銀髪を手で払いつつ串焼きを口に運ぶ。
夏の残り香が風に混じる。

「ふうん……まあ、船待ちの旅人は多いみたいだし。
　そういう日もありますよ」

言葉こそ柔らかいが、ほんの少し疲れがにじむ声。
これまで歩いたせいか、日差しの中で顔が火照っていた。

「暑いのか？」

「ちょっと……服に熱がこもるんです。
　君はよく平気ね」

「訓練でも一応、ガラメア鉄の鎧を着ることもあるけど。
　もう、あれに比べたら、これくらいはな」

ふたりの会話を遮るように、港の鐘が遠くで鳴る。
波止場の見張り交代の合図らしい。

「……それにしても、こうしてゆっくり飯食うの、久しぶりかもな」

「そうですね。
　旅の途中は、立ったまま何か口に入れて、終わり……みたいな日ばかりでしたし」

ミレイが串を見つめながら、ぽつりとつぶやく。

「……なんか、懐かしい味。
　干物を焼いて醤を塗っただけなのに……」

「口に合ったならよかった。
　ほら、汗かいたろ？
　塩気は体にちょうどいい」

ミレイはふと笑って、串を掲げてみせる。

「なるほど、戦士的な栄養理論」

「違うか？」

「……合ってると思います。
　ちょっと笑いましたけど」

ふたりの間に、ようやく風が抜ける。
潮の匂いと、焼けた鉄のような港町特有の香り。
その中に、ほんの一瞬だけ、懐かしい“街”の空気が混ざった気がした。

「……船に乗ってしまえば、ルニアまでは、あと少し」

ミレイがぽつりと呟いた。

「ああ」

クラウスが短く返す。
だがその先の言葉を、ミレイは言わなかった。

陽射しが、ふたりの影を地面に並べていた。
ティアルの港の船影はまばらであった。

＊

ティアルの市場を抜け、港の一角。
人通りから少し外れた石造りの建物。

青い屋根。表に看板はない。
だが、扉の前に立てばわかる。
ここは、“そういう場所”だと。

「外で待っててくれ」

クラウスがそう言うと、ミレイは素直に頷いた。

中は静かだった。
人の気配はあるが、声は抑えられている。

奥の机に座る初老の男が、ゆっくりと顔を上げた。
白髪混じりの頭に、穏やかな目。

「……おや。戻りましたか」

声音はやわらかい。

クラウスは姿勢を正し、軽く頭を下げた。

「報告に来ました」

「ええ、聞きましょう」

促されるまま、革袋から記録を取り出す。

「中央山脈北麓での野盗騒ぎ。
　情報通り、単独犯と接触しましたが――」

わずかに言葉が詰まる。

「……捕縛は叶いませんでした。
　二人がかりでも及ばず負傷、撤退しました」

その声には、悔しさが滲んでいた。

男は頷きながら、書き付けに目を落とす。

「“黒炎の剣士”……ですね」

「はい」

「こちらでもいくつか報せは入っています。
　ですが――」

事務方の男は指先で机を軽く叩いた。

「あなた方と交戦したあと、ぱたりと動きが止んだ」

静かな声だった。

「まるで、目的を変えたように」

クラウスは、ほんの一瞬だけ視線を伏せる。

あのとき。
ミレイと、あの男――ジルヴァは言葉を交わしていた。

自分には届かなかった何か。
だが、それを問うことはしなかった。

「理由は、こちらでも断定できていません。
　ただ、結果として中央山道は落ち着きました。
　商人の往来が回復しつつあります」

穏やかな笑み。

「任務は、これで十分でしょう。
　……あなた方は、よくやりましたよ」

クラウスはようやく、わずかに息を吐いた。

「……いえ。力不足でした」

「そう思えるなら、なおさらです」

書き付けを閉じて、男は目を細める。

「団長も戦隊長も不在でしてね。
　こんな老いぼれが取り仕切るしかないのですが」

男は苦笑してから、ふと声音を変えた。

「どうでしょう。
　できれば、このまま残り正式に籍を置く気はありませんか」

穏やかだが、はっきりした誘い。

「若く、実力もありますし、何より――」

一瞬、言葉を選ぶ。

「“外”を見てきた目をしている。
　こういう仕事には、必要なものです」

――もし、ここで頷いていれば。
別の道があったのかもしれない。

だが――クラウスは首を振った。

「俺たちには、行くところがあります」

迷いはなかった。
男はそれを見て、小さく頷いた。

「そうですか」

それ以上は引き止めない。

「では、〈青の家〉としては――」

再び書き付けを開き、一筆を入れる。

「あなた方二名、本任務をもって離脱とします」

静かな宣告。
けれど、確かな区切りだった。

「……道中の無事を」

クラウスは深く一礼する。

「世話になりました」

＊

扉を出た瞬間、潮の匂いとざわめきが一気に戻ってきた。

建物の壁際。
ミレイはそこに寄りかかるようにして立っていた。
腕には、小さな紙袋。

足音に気づいて、顔を上げる。

「……終わりました？」

「ああ。任務も、これで終わりだ」

ほんの一瞬。
ミレイの睫毛が伏せられる。

「……そうですか」

それだけ言って、すぐに視線を上げた。
そして、少しだけ肩をすくめる。

「ごめんなさい、ひとりで行かせて」

「気にするな。まだ疲れてるだろ――」

言いかけて、クラウスは言葉を切った。
視線が、自然とミレイの手元に落ちる。
小さな紙袋。

「……それは？」

「え？」

ミレイもつられて視線を落とし、あ、と小さく声を漏らす。
紙袋の中には、砂糖をまぶした焼き菓子。
ほんのり甘い香りが、ふわりと立ちのぼる。

「買いに行ってたのか……お前な」

「宿、取ってから……その……」

言い訳のように言ってから、ミレイはほんの少しだけ困ったように笑った。

「一緒に食べようかな、って」

それは、飾らない声音だった。

誰かに見せるためじゃない、
取り繕ってもいない、ただの思いつきみたいな優しさ。

クラウスは、一瞬だけ言葉を失う。

（……まいったな、ほんと）

責める気は、もうどこにも残っていなかった。
それよりも。
その優しさが、今は自分にだけ向けられていると、わかってしまうから。

「……まあ、いい」

クラウスは視線を逸らして、歩き出す。
紙袋を大事そうに抱え直して、ミレイが隣に並ぶ。
その歩幅に、無理はない。
さっきより、ほんの少しだけ近い距離で。

＊

潮風が吹き抜ける市場の路地を、クラウスとミレイは並んで歩いていた。

宿への道すがらにて、ミレイの手には屋台で買った甘い焼き菓子。
港町ティアルの陽はまだ高く、通りの陰には猫が寝そべっている。

「ねえ、クラウス君」

「ん？」

ミレイは、焼き菓子を眺めながら言った。

「……次の寄港先、少しだけ変えられないかな」

クラウスは歩みを止める。

「変える？　ルニアへの最短ルートから外れるってことか？」

「ええ。ちょっとだけ、ね」

ミレイは、曖昧に笑う。真意を測りかねる表情だった。

「……理由、聞いてもいいか？」

その問いに、ミレイはしばらく黙っていた。

通りの向こうで鐘の音が鳴る。
港の見張り塔が、正午の合図を告げていた。

「……昔、読んだ記録があるの。
　ザナンの外港とは別に、小さな港を使っていた時代があって」

「それを見に行きたいと？」

「……というより、感じてみたいのかも。
　大陸の“始まり”のような場所、っていうのかな……」

クラウスは、焼き菓子を手に取り、口に運びながら考える。

「……予定、多少ずらすくらいなら大丈夫だろ。
　あてはあるのか？」

そう言いながらクラウスの手が、また焼き菓子を取ろうとして小袋へ伸びた。
ミレイの目が、ほんのわずかに見開かれる。

「うん」

クラウスの指先が届くより先に、ミレイが小袋をそっと避ける。
行き場を失ったクラウスの手を無視して、そのまま続ける。

「マルブ泊っていう、小さな波止場。
　いまはほとんど使われていないけど、船は時折寄るみたい」

クラウスは、宙に止まった手を何事もなかったかのように顎へやり、考え込むような仕草を作る。

「地図には……あったな、北東に入った湾の中だ」

「君が案内してくれるなら、迷わず行けるでしょ？」

ミレイの言葉に、クラウスはふっと笑った。

「……まあ、道に迷っても、今さら驚かない」

ミレイも小さく笑う。

真意は語らなかったが、その瞳にはどこか懐かしさと、寂しさが混ざっていた。
寄り道の理由は、ただの好奇心ではない──そう、クラウスは直感した。

「じゃあ、もう一度港に行って、寄港船を探してみるか」

「……ありがとう、クラウス君」

並んだ足音が、石畳にやわらかく響いた。

＊

（……あの時の海に、似てる気がする）

クラウスを待ちながら、ミレイは広がる水面を見つめていた。
風に揺れる髪を押さえながら、ふと胸に込み上げてくるものがある。

（この先に、“本当の”帰り道なんて、ないのに）

けれども、どこかで思ってしまっていたのだ。
もしもこの水平線の向こうに、かつての世界が続いていたなら──

それはただの夢想。
叶わないこと。でも、
だからこそ、せめて少しだけ。

立ち止まりたかった。

「寄り道って……少し、ずるいかな」

自嘲気味に呟いたその声は、風に流れていった。

＊

笑っていた。
その笑顔は仮面ではなかった。
少なくとも、あの“公子”の頃よりは。

けれど、それが本当の“彼女”なのかは、まだ見えない。

――俺は今、誰を見ている？

あの夜、炎の中で見せた脆さ。
それを隠すように、今の彼女は笑っているのか。

（……寄り道ってのは、逃げたいってことでもあるのか）

けれど、言葉にはしなかった。

ひとつだけ分かるのは、彼女がときどき見せる顔を、自分がどうしようもなく、忘れたくないと思ってしまっていることだった。

＊

「ところで、今夜の宿の部屋についてだが」

クラウスが、できるだけ何気ない調子で切り出した。

「部屋？」

「ああ。もしかすると、同じ部屋になるかもしれないが」

「え？」

ミレイはきょとんとした顔で振り返る。
クラウスは一瞬視線を逸らし、咳払いをした。

「ほら、混んでたら、とか……」

「別に、同じ部屋でいいですよね？」

あっさりとした返答だった。
クラウスの思考が止まる。

（……いや、待て）

ミレイは手に持っていた紙袋を軽く持ち上げる。

「せっかく買ったのに、別々だと一緒に食べられないでしょう？」

「……は？」

「だから、
　部屋を別にするのは不便ですし、お金もったいないし。
　分ける理由ないじゃないですか」

まるで当然の結論のように言う。
悪気も、含みもない。

（違う、そういうことじゃない）

クラウスは心の中で静かに叫んだ。

ミレイが女だと知った今、同じ部屋というのは──いや、それは、

「まずいだろ……！」

「え？　何がですか」

ミレイは本気で不思議そうに首を傾げる。

「クラウス君、変なところ気にしますね」

（変なのはお前だ……！）

クラウスは心の中で叫んだ。

（お前は、わかってない……！
　そういう無自覚が、一番たちが悪いんだよ……！）

＊

昼下がりの港町。
市場通りでは、香辛料を振りかけた串焼きや果実酒、色とりどりの布が軒を飾り、通りには雑多な声と笑いが満ちていた。

宿の手配も無事に済み、クラウスとミレイは並んで歩いている。
ミレイはフードを外し、香辛料の匂いが交ざった風に揺れる銀の髪を押さえながら露店を眺めていた。

にぎやかな町の雰囲気に、ミレイの表情がわずかに和らぐ。

「……こうして歩くのも、なんだか妙ね。
　何か買って帰る？」

「お前がそれを言うのか」

「たまには、“普通の人間”の真似事もしてみたいの」

ミレイはそう言って、通り沿いの露店へふらりと近づいた。
そこでふと、何かに引き寄せられるように、立ち止まる。

それは、香油と香草を練り込んだ小さな香水瓶の店だった。
陽光を受けて、色とりどりのガラス瓶が棚に並んでいる。

ミレイは一本の瓶を取り、そっと蓋を開けた。
甘く、淡く、どこか懐かしい香りが、風に乗って鼻をくすぐる。

その瞬間、
ミレイの表情から笑みが消える。
動きが止まり、静かに視線が落ちる。

（――あの日、家に帰ったとき、リビングに漂っていた……）

自分がこの世界に来る前、元の世界で過ごしていた日々。
何気ない夕暮れの、ふとした記憶。
家族と入れ違いに帰宅して、ふと窓辺に置かれたままの香水を見つけたときの、あの――。

「どうした？」

クラウスの声が背後からかかる。

「……何でもない。
　ただ、懐かしい香りだったから」

言葉にわずかな震えがあった。
ミレイは笑おうとするように、ほんの少し口元を持ち上げた。

クラウスはそれ以上は何も訊かず、そっと彼女の隣に立つ。
ミレイはしばらく瓶を見つめたあと、それを一つ選んで、丸銅貨を数枚、差し出した。

「買っていくのか」

「ええ。……たまには、物に想いを預けるのも悪くないと思って」

その小瓶を大切そうに内ポケットにしまい、ミレイは再び歩き出す。
潮風がふたりの間をすり抜け、外套の裾を揺らす。

「それにしても、香りでそんな顔をするとは思わなかったな」

「なにか？」

「……意外だった。
　優しい匂いを、そんなふうに大切にしてるなんて」

「……人にはね、帰る場所があったのよ。
　少なくとも、かつては」

ミレイはふっと微笑んだ。
その笑顔は柔らかかったが、少しだけ寂しげだった。

＊

日が傾く頃、ふたりは宿に荷を預け、近くの食堂へ足を運ぶ。
薄灯りの店内は賑やかすぎず、旅人と地元客が混じっている。

「やっぱり、このへんの名物は魚だな」

クラウスが品書きを眺めてそう言うと、ミレイは軽く頷いた。

「じゃあ、煮物と野菜も頼んで。
　……あなた、ちょっと塩分取りすぎですよ」

「戦士にとって塩は命だ」

「それを言えば何でも通ると思ってない？」

ささやかなやり取りに、店主がにこやかに声をかけてくる。

「仲がよろしいですね。ご夫婦で？」

ミレイが咄嗟に口を開こうとした、その前に――

「まあそんなところです」

クラウスが穏やかに、けれど曖昧に笑って答えた。

ミレイはきょとんと彼を見たが、言い返す間もなく店主は微笑んで戻っていった。

「……あの」

「ああ言っといた方が静かに食える」

「……そういう問題でしょうか」

ミレイは口を尖らせつつも、それ以上は言わなかった。
その瞳の奥にほんの一瞬、複雑な色が揺れた。

＊

ミレイは黙々と食べながら、ふと匙を止める。

「……からかってるつもりなら、やめておいて」

クラウスは驚いたように顔を上げた。

「からかってなんかいない」

「……わたし、冗談のように言われるのは、苦手なの」

ミレイは視線を落としたまま言った。
声は静かで、責めるような響きはない。

クラウスは、すぐには答えなかった。

（冗談、か）

さっき自分が口にした言葉。
余計な詮索を避けるための、ただの言い回し。
――そのはずだったのに。

「……悪い」

短く言った。

「今度言うときは、冗談じゃなくするよ」

ミレイが、ゆっくりと顔を上げる。

「……今度なんてあるんですか？」

「ないとも限らないだろ」

ミレイはしばらく黙っていたが、やがてほんのわずかに口元を緩めた。

「……もう」

言葉にすれば、伝わるとは限らない。
けれど何も言わなければ、それこそ伝わらない。
そんな曖昧に思える距離が、妙に心地よく。
そして同時に、ちょっと厄介。

  <div class="wrap">
    <header>
      <h1 id="h-title">読み込み中…</h1>
      <div class="sub" id="h-sub"></div>
    </header>

    <section class="panel">
      <div class="audio" id="audio-wrap"></div>
    </section>

    <section class="panel" id="content-wrap"></section>

    <footer class="nav" id="nav">
      <a id="prev" class="btn" href="#" aria-disabled="true">← 前の話</a>
      <a id="index" class="btn" href="#">目次へ</a>
      <a id="next" class="btn" href="#" aria-disabled="true">次の話 →</a>
    </footer>
  </div>

  <script>
    (function init(){
      const hTitle = document.getElementById('h-title');
      const hSub = document.getElementById('h-sub');
      const audioWrap = document.getElementById('audio-wrap');
      const artWrap = document.getElementById('art-wrap');
      const beforeWrap = document.getElementById('before-wrap');
      const afterWrap = document.getElementById('after-wrap');

      hTitle.textContent = `${META.no}｜${META.title}`;
      hSub.textContent = META.id;

      if (META.audio) {
        let credit = '';
        if (META.audioCredit) {
          if (META.audioCredit.url) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                <a href="${escapeAttr(META.audioCredit.url)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(META.audioCredit.name)}
                </a>
              </span>`;
          } else if (META.audioCredit.name) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                ${escapeHtml(META.audioCredit.name)}
              </span>`;
          }
        }
        audioWrap.innerHTML = `<div>BGM${credit}</div><audio src="${escapeAttr(META.audio)}" controls controlsList="nodownload noplaybackrate" preload="metadata" loop></audio>`;
        const audio = audioWrap.querySelector("audio");
        audio.volume = 0.5; // 50%
      } else {
        audioWrap.textContent = '（BGM なし）';
      }

    const contentWrap = document.getElementById('content-wrap');

    if (Array.isArray(META.blocks)) {
      META.blocks.forEach(block => {
        if (block.type === 'time') {
          const panel = document.createElement('section');
          panel.className = 'panel time';
          const div = document.createElement('div');
          div.className = 'time-label';
          div.textContent = block.value || '';
          panel.appendChild(div);
          contentWrap.appendChild(panel);
        }

        if (block.type === 'location') {
          const panel = document.createElement('section');
          panel.className = 'panel location';
          const h = document.createElement('div');
          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
</body>
