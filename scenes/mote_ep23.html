    title: '旅路の傍らで、ほんの少しだけ',
    audio: '../assets/[MP3] Forest of Memories.mp3',

    blocks: [
      { type: 'text', content: `
戦闘のあと、ふたりは小さな祠の前で野営の準備をしていた。

胸当てを外し、クラウスは崩れた石段に腰を下ろす。
革紐を解く指先に、戦いの震えがまだ残っている。

シャツは裂け、血が滲んでいた。
無理もない。
あれだけの戦いをして、無傷で済むはずがない。

「……そんなになるまで」

「いいって。
　これくらい──」

言い終わる前に、ミレイの指が彼の腕に触れた。

体温が伝わる。
思っていたより熱い肌。
古傷の段差。
硬い筋肉の下で、鼓動が脈打っている。

（……こうして戦って）

触れたまま、離れない。

（……守って）

クラウスは、無意識に息を止めた。
触れられているのが傷なのか、それとも別の何かにか分からなくなる前に、視線を逸らす。

「動かないで」

ミレイは息を整え、掌に淡い光の紋を浮かべる。

（わたしには、効かないけれど）

[i]「編まれよ、癒しの糸――《エル＝リーメア》」[/i]

温かな光が、傷を包む。
治癒の魔力が、静かに流れていった。

クラウスの呼吸が、ふっと緩む。

「楽になった……」

ミレイの指先が、わずかに止まる。

「……ちゃんと、効いてる？」

思わずこぼれた声だった。

「ああ。
　さっきよりずっといい」

その返答に、胸の奥が静かにほどける。

「……気を付けてよ。
　わたし、治癒術は得意じゃないから」

＊

焚き火が小さく、ぱちぱちと鳴っている。
その赤い灯りをはさんで、ミレイは静かにスープを啜っていた。

その頬に、火の揺らぎが色を落とす。
けれど、ほんの少しの時間を経て――また無色になる。

「無理してるの、見てると落ち着かないな」

唐突な言葉だった。

「少しは、こっちを頼っていいんだぞ」

ミレイは、特に驚いた様子もなく、ほんのわずかに睫毛を伏せた。

「……頼らないわけじゃ、ないよ。
　迷惑かけたくないだけ」

「そう言うやつほど、困るんだがな」

クラウスは苦笑して、薪をくべる。

「……傷のことだけじゃない」

ミレイは答えない。

けれど、焚き火の揺れの奥で、ほんの少し口角が動いた気がした。

クラウスはそれを見て、視線を逸らした。
さっき、触れられた指先の感触が、まだ残っている。

胸の奥が、妙に落ち着かない。

言葉にはしなかったが、あの微かな笑みが――
ミレイという存在が、確かに“生きている”証だった。

焚火の赤が、ミレイの頬に揺れる。
透明だと思っていたその人が、今は確かに“熱”を持っている。

それは、火のせいだけではないように思えた。

    ` },

      { type: 'text', content: `

夜が明ける。
白い霧が湖を包み、空が淡く色づく。

ミレイは湖畔に立っていた。
素顔のまま。

朝の光の中で、結ばれていない髪が肩に落ちている。
風に揺れるたび、陽を反射する。

クラウスは視線を外そうとして――
一拍遅れた。

無理に作った姿勢ではない。
昨日より、背中の線が柔らかい。

「……もう起きてたのか」

「ええ。
　……うるさくしてしまいました？」

振り向いた銀の瞳が、柔らかい。

「いや、勝手に目が覚めただけだ」

結ばれていない髪が、肩に静かに落ちている。
昨日までのように、隠そうとはしていなかった。

「……髪、結ってないんだな」

「……楽なんです、このほうが」

小さく笑う。
その笑みに、昨日より迷いが少ない。

クラウスは喉の奥がわずかに熱くなるのを感じた。

（……生きろ）

自分が言った言葉。
それを、彼女は受け取っている。

そして、自分もまた。

「そうか」

ぽつりと、言った。
名は呼ばない。
それでも、その言葉はまっすぐ届く。

朝の光の中、ふたりの影が並ぶ。
近づきすぎず、離れすぎず。
けれど確かに、昨日までとは違う距離だった。

＊

想像よりも、旅は快適だ。

川辺の浅瀬に、細身の金属筒が静かに沈む。
浄水筒〈アクア・ボトル〉が、澄んだ音をひとつ鳴らすと、水の濁りは消える。

ミレイは短杖を取り出し、集めた乾いた枝を軽くつつく。
ぱち、と小さな火花。
魔力の火は大きく燃え上がらず、静かに、均等に広がってゆく。

さきほど汲んだ水を小鍋へ。
クラウスがナイフで削いだ干し肉と乾燥野菜を放り込む。
煮える匂いが立ちのぼるころには、空気の冷えもやわらいでいた。

食事を終えると、クラウスは軍装サックに荷をまとめ、残り火に靴で土をかぶせる。
防汚の魔織が編み込まれたミレイの法衣に落ちた灰は、払えば跡も残らない。

晴れた空の下、ふたりはほとんど同時に立ち上がった。

＊

「さて……ここが今の位置。
　街道を北東に抜ければ、港町ティアルまでは二日ってところだ」

クラウスが腰から地図を取り出し、木陰の地面に広げた。
風で端がめくれないよう石で押さえ、指先で道筋をなぞっていく。

その横から、ミレイが静かに覗き込んできた。

銀髪がさらりと肩に垂れ、陽を受けてきらめいている。
彼女は黙ったまま、じっと地図を見つめていた。

「ここがベルザェム平原で……こっちがアンの村。それから──」

「……北って、こっち？」

ミレイが突然、まったく逆の方向を指した。

「いや、逆だ。完璧に逆」

「……ああ、そっちね」

ミレイの指が微妙に西へずれる。
その様子を見たクラウスは、しばらく沈黙したままミレイの横顔をじっと見つめる。

「……お前、地図読めてないだろ」

「…………（沈黙）」

その無言が、答えだった。
クラウスは鼻をつまむように片手で額を押さえ、小さくため息をついた。

「道理で、いつも自信満々に間違えるわけだ……」

「それは、なんだか失礼な言い方では？」

「事実」

「……細かいことは気にしない」

「そのせいで遠回りしたこと、俺は忘れてない」

「ちょっと黙っててくれる？」

「はあ……まあ、いいよ。
　方向感覚についてはもう期待してない」

「なんかそれ、地味に傷つく」

「じゃあ確認。これは川だな？」

「うん」

「で、この青いのは？」

「湖？」

「……じゃあ、このマークは？」

「…………毒沼？」

「……村だ。普通に人が住んでる」

ミレイはむっとした顔で地図から視線をそらす。

「だってこんな記号、紛らわしいのが悪い」

「いやいや、魔術書は読み解けるのに地図で迷うなよ」

「知識と現実は別なのだよ、クラウス君」

クラウスは苦笑するしかなかった。

「……まあ、道案内は俺がやる。
　お前は雲でも眺めてな。”公子殿”」

「子ども扱いするのやめてくれる？」

「じゃあ、レディ扱いで」

「……もっと腹立つ」

そう言いながらも、ミレイの口元にはうっすらと笑みが浮かんでいた。
昼下がりの風が草を揺らし、木漏れ日がふたりの影を穏やかに揺らしている。

地図は風にめくれかけながらも、次の道を指し示していた。
旅路は、まだまだ続く。

＊

陽射しは穏やかで、風だけが枝を揺らしている。
森を抜けた山裾の道沿い、二人は少し開けた平地で小休止を取っていた。

地面に膝をついたミレイは、くるりと巻いた布の筒から羊皮紙を引き出し、静かに地図を広げている。
目を細めて輪郭線を追い、次に文字列に視線を移す――けれど、しばらくして、細く息を吐いた。

「……地形はわかった。道も。けれど……」

ミレイは言葉を濁すように、地図の上に置いた指を止めた。

クラウスが水筒を肩に提げたまま戻ってきたのは、その時だった。
彼女の様子をひと目見る。

「また見てたのか。見すぎて道に迷うぞ」

冗談のつもりだったのかもしれない。
だが、ミレイはわずかに眉を寄せた。

「……なんだか不安で」

「不安？」

「……こうして図にすれば、簡単に見えるでしょ？
　道は一本で、場所も記されていて」

「だな」

「でも、現実は違う。
　木々は鬱蒼として、斜面は崩れて、距離感も脚の感覚も合わない」

ミレイの指が、地図の上で止まる。
そこには、川を越えてからの広野――ティアル手前のルートが描かれていた。

「……歩いてみると、全然違うんです」

クラウスは無言のまま、彼女の隣にしゃがんだ。
ただ彼女の視線と同じ場所に目を落とす。

しばらく沈黙があった。

「知っていると思っていたのに、知らないって思い知らされるなんて」

ミレイがぽつりとつぶやいた。

「……そういうもんだ」

クラウスが答える声は静かだった。

「でも、それに気づけるなら、お前は大丈夫だ」

その言葉に、ミレイはほんのわずかに肩を揺らした。
そして、指先で地図の角を押さえようとした瞬間――

風がひと吹き。
めくれかけた羊皮紙の端に、もうひとつの手がそっと添えられた。

クラウスの手だった。

彼は何も言わずに、ただ自然に、ミレイの手の上に重ねたわけではなく、
地図の「次の一歩」を押さえるように、さりげなく、指先を沿わせていた。

「――この地図が、ちゃんと進む方向を示してるなら。
　俺が先に歩く。お前が迷わず進めるように」

ミレイはしばらく黙っていた。だが、
手の甲に重なる温度を感じながら、ふと静かに言う。

「……わたしなりに、そのつもりです。」

「なら、信じる。お前の進む先を」

めくれかけていた羊皮紙が、ようやく静かに落ち着く。
ミレイは手を引かず、地図を見つめたまま、わずかに目を細めた。

「……ありがとう」

この道が、間違っていないと信じたい。
けれど本当は、進んで確かめるしかないことも、もう知っている。

＊

街道の先に、長い石橋が現れた。
その下には広くて緩やかな川が流れている。
欄干は低く、風が吹けば川音と共に空へ抜けていく。

「ここを渡れば、あとは緩やかな道だ」

クラウスがそう言うと、ミレイは無言で頷き、足を進めた。

ふたりは並んで橋を歩いていた。
けれど、歩調はきっちりとは揃わず、ミレイの足音が先に響いたかと思えば、
次の一歩ではクラウスのほうが前へ出る。

橋の中ほどに差しかかったときだった。
ミレイがふと足を止め、視線を川の流れへ落とした。

「……クラウス君」

「ん？」

「今のわたしって、“変”ですか？」

クラウスは驚いたように顔を向けた。
だが、ミレイは彼のほうを見ていない。
川に映る光のきらめきを見つめたままだ。

「変じゃない。
　……ただ、前のお前は、何も見せなかった」

「見せなかった？」

「辛くても平気な顔してた。
　誰にも触らせなかった」

ミレイは少しだけ目を細めた。

「今は？」

「ちゃんと困るし、悩む。
　変だって言う。
　俺には、それが素顔に見える」

その言葉に、ミレイは一度だけ深く息を吸って、吐いた。
まるで胸の奥の霧を払うように。

「……君にとって、わたしは“遠い”？」

「遠い、って思ったことはある」

「今は？」

「うん。
　――今は、ちょっと近いかも」

ミレイはようやく彼のほうを見て、いたずらっぽく微笑んだ。

「じゃあ、今のうちに距離詰めておきましょう。
　橋の幅、狭いから」

クラウスもつられるように微笑んだ。

「たしかに。譲り合いの余地はないな」

ふたりは再び歩き出す。
さっきよりも少しだけ、歩幅が合っていた。

考えることが、迷いを生むこともある。
けれど、足を止めない限り――この橋は、きっと渡れる。

＊

森の中。
月明かりが木々の隙間から降り注ぐ夜。

焚き火のぱちぱちという音だけが、静寂をやわらかく彩っていた。

クラウスは地面に腰を下ろし、剣を丁寧に磨いている。
その隣で、ミレイは膝に開いた帳面に何かを書きつけている――ように見えた。

「ミレイ、今夜の火の番は……」

声をかけたクラウスが、ふと背後の気配に気づく。

振り返ると、ミレイがいつの間にか背後に立っていた。
そっと、というより忍び寄るように。
そして、彼の外套の端を小さく握っている。

「……どうした？」

クラウスが問いかけると、ミレイはわずかに視線を逸らした。

「……少し。
　焚き火のそばに行くと、熱すぎるから……」

クラウスは黙って見つめる。
だがミレイの目線は明らかに火ではなく、地面の暗がりへ向いていた。

「……まさか、お前……」

「さっき、足元に……何かいました。
　黒くて、足がたくさんある……」

ミレイはかすかに身を震わせながら、小声で告げる。

「それ、虫だな」

クラウスが堪えきれずに笑いかけると、ミレイは少しむくれて口をとがらせた。

「……君は平気なんですか？
　あんなのが、夜中に這い寄ってきても」

「まあ、刺さなければ」

クラウスが立ち上がると、ミレイは本能的に一歩下がった。
それと同時に、掴んでいた外套の端が外れ、彼女の手が空を切る。

「……っ！」

思わずクラウスの袖を掴むミレイ。

夜の帳が包む中で、ふたりの距離がふと近づく。

「……虫は苦手、です。
　別に、変じゃないですよね？」

クラウスはその問いに、わずかに真顔になって返した。

「いや、ちょっと……可愛いと思っただけだ」

「なっ……！」

ミレイの顔が、月明かりの下でわずかに朱を帯びる。
すぐに目を逸らし、静かに背を向けながらぽつりと呟く。

「……言いましたね。覚えておいてくださいよ」

焚き火の火が、静かに揺れた。

その夜、ふたりの心にともった火は、ほんの少しだけ、暖かかった。

      const hTitle = document.getElementById('h-title');
      const hSub = document.getElementById('h-sub');
      const audioWrap = document.getElementById('audio-wrap');
      const artWrap = document.getElementById('art-wrap');
      const beforeWrap = document.getElementById('before-wrap');
      const afterWrap = document.getElementById('after-wrap');

      hTitle.textContent = `${META.no}｜${META.title}`;
      hSub.textContent = META.id;

      if (META.audio) {
        let credit = '';
        if (META.audioCredit) {
          if (META.audioCredit.url) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                <a href="${escapeAttr(META.audioCredit.url)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(META.audioCredit.name)}
                </a>
              </span>`;
          } else if (META.audioCredit.name) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                ${escapeHtml(META.audioCredit.name)}
              </span>`;
          }
        }
        audioWrap.innerHTML = `<div>BGM${credit}</div><audio src="${escapeAttr(META.audio)}" controls controlsList="nodownload noplaybackrate" preload="metadata" loop></audio>`;
        const audio = audioWrap.querySelector("audio");
        audio.volume = 0.5; // 50%
      } else {
        audioWrap.textContent = '（BGM なし）';
      }

    const contentWrap = document.getElementById('content-wrap');

    if (Array.isArray(META.blocks)) {
      META.blocks.forEach(block => {
        if (block.type === 'time') {
          const panel = document.createElement('section');
          panel.className = 'panel time';
          const div = document.createElement('div');
          div.className = 'time-label';
          div.textContent = block.value || '';
          panel.appendChild(div);
          contentWrap.appendChild(panel);
        }

        if (block.type === 'location') {
          const panel = document.createElement('section');
          panel.className = 'panel location';
          const h = document.createElement('div');
          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
</body>
</html>
