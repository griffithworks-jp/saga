聖都が見えてきたのは、朝の霧が山の影を解きほぐし始めた頃だった。

丘を越えたその先に――
白銀の壁と塔の群れが、朝日を受けて光の都のように浮かび上がる。

遠目にはまるで白く咲いた花のような光景だった。
だが実際には、膨大な年月と血の歴史の上に築かれた、
ザナン連合国家の心臓部――それがルニアである。

城壁は三重に連なり、最外郭だけでも数千の兵が常駐すると言われている。
その城壁の石は雪解けの水を吸い、朝の陽に濡れて鈍く青白く輝いていた。

中央には、庇護の天門（ゲート・オブ・アキューリーズ）と呼ばれる巨大な門楼。
純白の翼を広げた十字の紋章が描かれた大旗が高々と掲げられている。
魔族との戦を越えてきた、始祖たる五公〈クインケ・クラン〉の象徴だ。

都の中心には、白亜の政庁がそびえている。
ザナン五公が集う合議の館にして、盟主の政務が執り行われる――
この国の意思が、ここで形を持つ。

尖塔は天に向かってまっすぐ伸び、上部には天使の彫像が祈るように翼を広げていた。
街全体が丘陵に沿って築かれており、石畳の道は複雑に分岐しながら、各貴族邸、聖堂、広場、商館を結んでいる。

街のあちこちに水が流れる小運河が走り、春を告げる小花が苔むした壁のあいだから顔をのぞかせていた。
行き交う人々の衣は、冬の名残を留めながらも、心なしか明るい色合いに変わっている。

それでも、この街の空気には、常にどこか緊張感が漂っていた。

表面上は平穏だが、政争・信仰・魔の脅威……
この国の命運を決める者たちが集う都市に相応しい、美しさと冷たさが交錯する都だった。

ミレイは、街の遠景を見つめながら、ひとつ小さく息を吐いた。

（……ここからが、本当の“舞台”）

その言葉に、自分で小さく違和感を覚えながら、
外套の前を留め直す。

その背に、クラウスの足音が近づく。

「まもなくです」

「……ああ」

言葉は少なくとも、視線は確かに、同じ方向を向いていた。
彼らを乗せた馬車は、ゆっくりと、聖都ルニアの正門へと吸い込まれていく。

      { type: 'text', content: `

「失礼いたします、閣下」

扉を静かに開いたのは、若いが知性を感じさせる黒衣の男。

「……ヴェルディスか」

太い木柱が梁を支える広間、その中央にはガリヤ公爵――

始祖たる五公〈クインケ・クラン〉の一角にして、現・盟主。
その人は、半ば寝台に腰を下ろしたまま、銀糸の紋付の上着の胸元に、赤褐色の襟布を巻いていた。

「どうしたのだ？」

「“公子”が到着されました。
　今、お通ししております。もう少しでお見えになるかと」

ガリヤ公爵は、口元にうっすらと笑みを浮かべる。
老いてなお、威厳を宿すその声音には、わずかな安堵の色が混ざっていた。

「いよいよか」

「度々の不手際、申し訳ございません」

「かまわん。
　この命も、もはや尽きるかと思うたが。
　老いてますます、などというわけか」

老公は咳払いひとつしながら、天井の梁を見上げた。
窓の外では、季節が一段進んだ明るい光が、薄いカーテン越しに差し込んでいる。

「人間、大詰めを迎えると丈夫になるらしいな。
　由緒正しき五公家、魔術の名門……そして、王たる資質を持つ系譜。
　儂（わし）の代で終わるわけにはゆくまいて」

その声音には、誇りと、そしてわずかな寂寥があった。

「息子を失い、一時はすべてが終わったと思ったが――此度の話、
　まさしく、暗闇に光が射したごとくぞ」

「……畏れ多きお言葉。
　それに私とて、ガリヤの家名が途絶えることが惜しかったのでございます」

老公は、視線だけをヴェルディスに向ける。

「貴君の働き。まことに大儀であった。
　それにしてもよく、あのような“奇怪な話”を探し当ててきてくれたものよ」

ヴェルディスは、目を伏せて膝を折った。

「……その忠誠ぶり、引き続き、次代の者にも頼みたいものだな」

「勿論でございます」

その時――

トン……トン……

扉を控えめに叩く音が、静かな室内に響いた。

ヴェルディスが目を細め、扉の方を振り向く。
ガリヤ公爵もまた、深く息をつき、膝の上で両手を重ねる。

「――来たか」

＊

静かな間が流れる――
扉の向こうから聞こえるノック音が、まるで運命の拍子のようだった。

「……失礼いたします」

控えめに扉を開けて進み出たのは、銀髪の少年の姿。
濃紺の衣に身を包み、銀眼をまっすぐに向けて一礼する。

「来たまえ」

ガリヤ公爵の声が、老いてなお威厳を帯びた響きで空間を支配する。

壁には絵画ではなく、古い戦旗や地図が無造作に掛けられている。
椅子や卓は装飾こそ控えめだが、いずれも分厚く、使い込まれた傷がそのまま残されていた。

ミレイは、心の底に冷たいものを抱えたまま、一歩、また一歩と室内へ進む。

「……君が、か」

「はい」

静かに応じた声は、男としての低い抑揚を保っていた。
襟元には、小さな発声装置が仕込まれている。

老公はミレイをしばし見つめた。
その視線に、探るような色が宿る。

「……聞いていたより、儂の息子に似ているとは思えぬが」

「一年ほど前に確認した際は、瓜二つでしたが」

ヴェルディスの言葉に、老公はふう、と短く息を吐く。
そして、銀に近いその髪色から、視線をいったん外した。

胸の奥で、遠い記憶がかすかに揺れる。
若き日の妻。
その髪もまた、光の加減によっては、灰を帯びて見えたことを――
老公は、誰にともなく思い出していた。

「……まあ良い」

自らに言い聞かせるように、そう呟く。

「子は成長するものだ。面影など、時とともに薄れる。
　それに、まったく似ていないわけでもない。
　庶民や諸侯の目には、違いなど分かるまいよ」

再びミレイへと視線を戻す。

「ところで、君がここに来た理由。
　分かっておるか」

静かに、しかし明確な試しの問い。

ミレイは一拍、間を置き――静かに頭を垂れた。

「……はっ。“父上”」

その声が発せられた瞬間。
室内の空気が一瞬、固まったようにすら感じられた。

老公は、長い沈黙ののち――

「……及第だ」

と、わずかに微笑んだ。

その視線には、何かを見透かしているような光があったが、
それを肯定するかのように、軽く頷く。

「――残りのことは、ヴェルディスに任せよう。
　儂は……少々、疲れた」

そう言って、ガリヤ公爵は背に身を預け、小さく息を整えた。
まだ疲労の色はあるが、伏すほどではない。

若き側近ヴェルディスが、さっと前へ出た。

「公子殿。
　このままお部屋へご案内する前に、少々お待ちいただきたく」

ミレイは問い返さずに頷く。
いまは、それで十分だった。

（“公子”になった。たった今、このわたしが――）

その重みを、身体の芯でひしと受け止めながら、
静かに扉の向こうへと歩を進めていた。

＊

厚い扉が静かに閉じられると、赤褐色の煉瓦壁に囲まれた回廊にわずかな風が吹き込んできた。
ミレイは深く息をついて一歩進み、控えていたクラウスのもとへ歩み寄った。

「お話は終わりですか？」

と、クラウス。

「ええ……」

ミレイは短く頷き、あくまで無表情を保った。

クラウスは少しだけ首をかしげたようにして、眉を下げた。

「久しぶりの再会なのに、嬉しくなさそうだ」

それは、冗談めかしたつもりの言葉だった。
だが、ミレイはほんのわずか間を置いて、目を伏せる。

「……いいから、君も入りなさい」

言葉の端に、かすかな疲れが滲んでいた。

「父上は、君にも話したいことがあるらしい」

その言葉に、クラウスは目を見開き、すぐに姿勢を正した。

「では」

軽く頭を下げ、クラウスは扉の方へと向き直る。

ミレイはその背中を見送る。

クラウスが扉をノックし、再びあの部屋へと入っていく音が響いた。

＊

扉が静かに閉じられると、再び静寂が戻った。
クラウスはそのまま進み出て、床に片膝をつき、深く頭を垂れた。

「クラウス・バウル、参上つかまつりました」

ガリヤ公爵は、その姿をしばし無言で見つめ――やがてゆっくりと口を開いた。

「……ご苦労であった」

「は」

クラウスは簡潔に応じる。
視線はなおも床に伏せたままだ。

「“あれ”も、またすぐにここを発たねばならん。
　引き続き、護衛を頼もうか」

老公は、わざとその言い回しを選んだようだった。
“息子”とは言わず、“あれ”と呼んだことに、クラウスは一瞬眉を寄せた。

そのわずかな変化を、傍らに立つ若き側近ヴェルディスは見逃さなかった。

「次の行き先は、〈青の家〉。
　七つ国で近頃、噂の民間組織にございます。
　今回は船も手配しております。
　行程は前回より幾分、楽かと」

「分かりました。……しかし」

ここでクラウスは顔を上げ、やや躊躇いがちに言葉を続ける。

「――あのような、非正規の武装集団に、なぜまた？」

静かな問いだったが、その瞬間に老公の目がほんの僅かだけ細められる。

「君は、何も知らずとも良い」

きっぱりとした口調。
それは問いを封じる言葉とともに、下の者には余計な思慮は無用という、貴族の権威そのものであった。

「……公爵閣下には、公爵閣下のお考えというものがあるのだ。
　それとも、この任務が嫌かね？」

横からヴェルディスが口を開く。
語調は柔らかだが、芯には鋼のような圧がある。

クラウスは、短く目を伏せ――

「……いえ」

応じた声は低く、努めて平静だったが、拳にはわずかに力がこもっていた。

（――“考え”か。勝手なものだ）

そう呟くような思いを、クラウスは奥底に沈めた。

老公は、そんな彼の反応に満足したのか、今度は少し口元を緩めて言った。

「ところで――“あれ”はどうかね？
　わが息子について、率直な感想を聞きたいのだ」

老公の問いに、クラウスはほんの一瞬、言葉を詰まらせた。
頭に浮かぶのは、旅の途上で見た“公子”の姿だった。

――細身の身体で、両手でやっと剣を構える様子。

――魔物との戦いで見せた、冷静だが脆さを含んだ気配。

――震える手で、それでも前へ進もうとする姿。

（“公子”か……）

この場で本音を語ることが、己に何をもたらすかはわかっている。
だからクラウスは、口角をほんの僅かに持ち上げ、静かに言った。

「――他者にない、気風のようなものがあります」

「ほう」

老公の目が細められた。

「剣技はおろか魔術にも詳しく、そこらの兵にも劣らぬ力を備えており
　……大変、素晴らしい方です」

その声音はあくまで冷静だったが、どこか、感情を切り離した仮面のようでもあった。

ヴェルディスがわずかに眉を上げて、視線を横に流す。
クラウスはその反応にも気づいたが、表情は変えない。

「……そうか」

老公は静かに頷いた。それ以上詮索することはしない。

「――“あれ”には、替えが利かぬからな。
　万が一のことがなきように」

その言葉に込められた重みを、クラウスは察する。

「では、行くが良い」

その最後の言葉を背に受けながら、クラウスは無言で頭を垂れ、
静かに後ずさり、扉の方へ向かった。

その背に、公爵と側近の目が重なる。

やがて扉が低い音を残して閉じられると、室内には再び静寂が戻った。

＊

身を預けるようにしていたガリヤ公爵は、重たくなり始めた空気の中で、しばし目を閉じているようだった。

「……しかし、本当に、あのロネイル家の子に――
　護衛の任を与えて良いのですか？」

側近のヴェルディスが危惧を口にする。
老公はゆっくりと瞼を開け、年老いたその目をわずかに細めて言った。

「奴は、刃だ」

低く、含むような声だった。

「使い方を誤れば、自らを傷つける凶器となる。
　だが、上手く扱えれば、武器ともなろう」

かすかに口元をゆるめ、乾いた独り言のように続ける。

「……力なくして、この世を渡ってはいけぬ。
　かつての儂に、かのロネイルが居たようにな」

ヴェルディスの眉が、わずかに動く。

「……使いこなせるでしょうか？」

「それは――あの“偽りの息子”しだいだ」

老公は指を組み、ただ静かに言う。

「できぬのであれば……終焉だ」

部屋の片隅で、ランプの火が熱を孕んで小さく揺れた。

＊

深く沈んだ廊下の絨毯に、靴の音はほとんど吸い込まれていく。
クラウスはふと、立ち止まった。

広間の窓の向こう、雪解け水を吸った土と、濃くなり始めた緑の庭に目を向けながら、彼は心の中で呟く。

（――親と、子）

（“あれ”には、替えが利かない、か）

――ならばもし、“替えの利かぬ”あの子息を、失わせたなら。
それはすなわち、ガリヤにとって唯一の存在を、奪うことになる。

ガリヤ公爵――ロネイルの仇に対する、最も痛烈な報復となるだろう。

クラウスは、無表情のまま歩き出す。
しかし、拳は見えぬところでかすかに震えていた。

（機は、まだ先でいい。だが、必ず――
　家族を殺された痛みを、あの老いた貴族に……思い知らせてやる）

薄く熱を帯びた光が差し込む長い廊下の奥へ、少年の背が静かに遠ざかっていった。

＊

聖都・中央区の石畳を少し外れた裏通り。
訓練所の一角、葉の色を濃くし始めた街路樹の下で、クラウスは木のベンチに腰かけていた。

鎧は着ていない。
剣も外し、肩の力が抜けている。

けれど、その表情はどこか沈んでいた。

「……溜め息つくには、まだ昼よ？
　ほら、空、ちゃんと晴れてるじゃない」

聞き慣れた声が、不意に横から飛んでくる。

振り向くと、リボンでまとめた飴色の髪が陽をはねて揺れていた。
迷いのない足取りで、鮮やかな瞳の少女がクラウスの隣に腰を下ろす。

「エリセ……なんでここに？」

「なによ、“なんで”って。
　お昼の散歩に決まってるじゃない。
　あんたがあんまり顔出さないから、訓練所の人にも“どこ行ったか知ってる？”って聞かれたわよ」

クラウスは小さく頭を掻く。

エリセリア・フォン・ロズベルン。
さる貴族家の次女にして、昔からの幼馴染。
遠慮という言葉をどこかに置いてきたかのような調子だが、悪気はない。

「……最近は忙しいんだ。任務があるし」

「ふぅん。“公子様付き”の従騎士様は、やっぱり違うわけね」

「……からかうなよ」

エリセは頬杖をつきながら、クラウスの顔を覗き込む。

「あんただって、昔はただの“剣バカ”だったのに」

「……あの頃の話をするな」

「そうやってすぐ真顔になる。
　あーもう、ほんと真面目って損ね。
　少しは笑いなさいよ、ねえ？」

その軽口に、クラウスも自分でも気づかぬうちに、口元をわずかに緩めていた。

「……都の空気に、慣れなくてさ」

「……そう」

その一言に、エリセは少しだけ目を細めた。
ただ、それ以上はなにも聞かなかった。

「ねえ、お茶でも飲みに行こうよ。
　あんたの分も私が払うからさ」

「……貴族のお嬢様に誘ってもらえるのか」

「言っとくけど、奢るってだけで変な意味はないからね。
　というか、ただの気分転換よ？」

「はは……分かった。
　休みが取れたら、考える」

「じゃ、そういうことで。
　またサボってるの見つけたら、次は無理やり連れてくからね！」

そう言ってエリセは笑って手を振り、石畳の向こうへ消えていった。

その背を見送りながら、クラウスはほんのわずかに息を吐く。
気を許せる存在が、今も都にいることが、どこか救いだった。

彼は空を見上げる。
雲は高く、陽射しはすでに夏の気配を含んでいた。

＊

夜の名残を含んだ風が、まだわずかに冷たい朝。
ガリヤ公爵邸の厩舎前にて、馬車の準備が進められている。

ミレイはいつもの黒い外套の襟元を直しながら、風に揺れる銀の髪を押さえ、
静かに時を待っていた。

そのとき。

「――待ってくれ！」

鋭く割って入る声。
ミレイが振り向くと、クラウスが駆け寄ってくる。

「……クラウス君？」

少しだけ意外そうな声。
だがミレイの表情は変わらない。

「俺も……連れて行ってくれ」

ミレイの銀の眼がわずかに細められる。

「せっかくですが、必要ありません。
　……今回の任務は、ひとりで十分です」

ミレイは襟元を指で撫でながら言った。

「……父上に言われたのでしょうけど。
　今回は船で行くわけですし、護衛を付けるようなことでもないでしょう」

言葉は柔らかだが、その中にある微かな拒絶は隠されてもいなかった。

しかしクラウスは、一歩も退かなかった。

「――いえ。行かせてください。
　道は知っています。邪魔にはならない」

ミレイはしばし黙ってクラウスの顔を見つめる。
その視線が、真意を見極めようとするように。

クラウスは、視線をそらさなかった。

（……罪悪感が無いわけじゃない。
　だが――それでも、やる）

彼の中で、一つの決意が形を成していた。

（“あれ”を失わせれば……あの男への最大の報復になる）

復讐。それが目的。

なのに、その視線の奥に潜む、わずかな躊躇――
それが何に由来するのか、クラウス自身もまだ気づいていない。

クラウスは答えを待たず、馬車の後部に積まれた荷の上へ鞄を放る。
御者の視線も気にせず、そのまま乗り込む支度を始めた。

ミレイとクラウスの物語は、再び旅へと向かう。
    ` }

  <div class="wrap">
    <header>
      <h1 id="h-title">読み込み中…</h1>
      <div class="sub" id="h-sub"></div>
    </header>

    <section class="panel">
      <div class="audio" id="audio-wrap"></div>
    </section>

    <section class="panel" id="content-wrap"></section>

    <footer class="nav" id="nav">
      <a id="prev" class="btn" href="#" aria-disabled="true">← 前の話</a>
      <a id="index" class="btn" href="#">目次へ</a>
      <a id="next" class="btn" href="#" aria-disabled="true">次の話 →</a>
    </footer>
  </div>

  <script>
    (function init(){
      const hTitle = document.getElementById('h-title');
      const hSub = document.getElementById('h-sub');
      const audioWrap = document.getElementById('audio-wrap');
      const artWrap = document.getElementById('art-wrap');
      const beforeWrap = document.getElementById('before-wrap');
      const afterWrap = document.getElementById('after-wrap');

      hTitle.textContent = `${META.no}｜${META.title}`;
      hSub.textContent = META.id;

      if (META.audio) {
        audioWrap.innerHTML = `<div>BGM</div><audio src="${escapeAttr(META.audio)}" controls controlsList="nodownload noplaybackrate " preload="metadata" loop></audio>`;
        const audio = audioWrap.querySelector("audio");
        audio.volume = 0.5; // 50%
      } else {
        audioWrap.textContent = '（BGM なし）';
      }

    const contentWrap = document.getElementById('content-wrap');

    if (Array.isArray(META.blocks)) {
      META.blocks.forEach(block => {
        if (block.type === 'time') {
          const panel = document.createElement('section');
          panel.className = 'panel time';
          const div = document.createElement('div');
          div.className = 'time-label';
          div.textContent = block.value || '';
          panel.appendChild(div);
          contentWrap.appendChild(panel);
        }

        if (block.type === 'location') {
          const panel = document.createElement('section');
          panel.className = 'panel location';
          const h = document.createElement('div');
          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
</body>
