  <style>
    :root { --bg:#0f1320; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; }
    html, body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }

    header h1 { margin:0 0 6px; font-size: 1.2rem; }
    header .sub { color: var(--muted); font-size: .9rem; margin:0 0 8px; }

    .panel { background: linear-gradient(180deg, #1a1f33, #151a2a); border:1px solid var(--border); border-radius:12px; padding: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
    .panel + .panel { margin-top: 10px; }

    em.chant { font-style: italic; color: #cfd8ff; letter-spacing: 0.05em; text-shadow: 0 0 6px rgba(180,200,255,.25); }

    .audio-credit { font-size: .72rem; color: var(--muted); opacity: .65; }

    .caption { color:var(--muted); line-height:1.7; font-size: 1rem; white-space: pre-wrap; }

    footer.nav { display:flex; gap:8px; justify-content:space-between; margin-top:14px; flex-wrap:wrap; }

  <script>
    function setFontSize(size) {
    const root = document.documentElement;
    if (size === 'large') {
      root.style.setProperty('--font-body', '1.25rem');
      root.style.setProperty('--line-body', '2.1');
      localStorage.setItem('fontSize', 'large');
    } else if (size === 'small') {
      root.style.setProperty('--font-body', '0.9rem');
      localStorage.setItem('fontSize', 'small');
    } else {
      root.style.setProperty('--font-body', '1rem');
      localStorage.setItem('fontSize', 'normal');
    }
  }
  (function(){
    const saved = localStorage.getItem('fontSize');
    if (saved === 'large') {
      document.documentElement.style.setProperty('--font-body', '1.25rem');
      document.documentElement.style.setProperty('--line-body', '2.1');
    } else if (saved === 'small') {
      document.documentElement.style.setProperty('--font-body', '0.9rem');
    }
  })();
  const META = {
    id: 'mote_ep30',
    no: '第30話',
    title: 'ネゼヴシャイアの影',

    audioCredit: { name: 'かねこかずき', url: 'https://kazuki-kaneko-music.com/' },

      { type: 'text', content: `
村は穏やかだった。
外から見れば、そう見えた。

巡礼者は途絶え、鐘楼は苔むしている。
けれど、窓辺には明かりがあり、家々からは夕餉の匂いが漂い始めていた。

昼間には畑仕事の声が聞こえ、子供たちが通りを駆けている。
何も起こっていない、ただの山間の村。

ミレイは宿へ戻る道を、ひとり静かに歩いていた。
ふと、道端の家の前、白髪をひとつに束ねた老婆が立っているのが目に入った。

ミレイは軽く会釈をする。
老婆も顔を上げ、穏やかに笑った。

ミレイはそのまま通り過ぎようとしたが、思わず足を止めた。
小さな庭では、一本の箒がひとりでに動いている。

落ち葉を掃いて、集めては庭のすみに寄せる。
そうしてまた、くるりと向きを変えて別の場所へ向かう。
箒は老婆の手元になく、ひとりで庭を行ったり来たりする。

「そこじゃないよ。
　そっちはもう掃いたろ」

箒はぴたりと止まって、少しだけ向きを変える。

「そうそう。そっちだよ」

「……」

「おや」

ミレイが黙って見ていると、今度は老婆のほうがミレイを見つめる。

「お嬢ちゃん……魔術師かい」

「はい」

ミレイは少し驚いたように答えた。

「じゃあ、あんたもまじないを使うんだねえ」

「……あの、こちらでは、まじない師を？」

「昔からね」

老婆は箒を見て笑う。

「火を起こしたり、水をきれいにしたり。
　畑の虫を追ったり、子供の熱を下げたり。
　たいした術じゃないけど、この村じゃそれで十分だったよ。
　ただ……」

「……よろしければ、少しお話を伺ってもいいでしょうか」

「ああ、もちろんさ……」

そう言って、家の扉を開いた。

「立ち話もなんだ。
　お茶くらいなら出せるよ」

「ありがとうございます」

ミレイは小さく頭を下げ、老婆の後に続いた。

＊

家の中には古びた祭壇。
薬草を束ねたもの。
壁際には小さな瓶がいくつも並び、乾燥させた葉や根が吊るされている。

そして、部屋の隅に――
少し大きめの古い杖が一本、立てかけられていた。

ミレイの視線が、ほんの一瞬そこへ向く。
老婆はそれに気づいたようだったが、何も言わなかった。

「……にしても、珍しいわねえ。
　こんな山奥に、役人でもあるまいに」

ひしゃげた椅子をすすめられ、ミレイは腰を下ろす。

「旅の途中で、この村を通ることになったものです」

ミレイは穏やかな口調で答える。

老婆は湯を沸かし始めた。
短い杖を小さく振って火をつける、その手つきは慣れている。

老婆は、ひと呼吸置いて湯を注ぎながら、ぽつりと呟いた。

「……夢の話なんだけどねえ」

ミレイは湯気の向こうで、老婆の顔を見た。

「最近、この村じゃね。
　妙な夢を見る者が増えてるのよ」

老婆は湯飲みをミレイの前へ置き、自分の分にもゆっくりと茶を注ぐ。

「誰かに、名前を呼ばれるんだってさ。
　最初はねえ、懐かしい声に感じるらしいの」

「……懐かしい声？」

「昔の知り合いだったり、もう会えない人だったり。
　人によって違うみたいだけどね」

老婆は湯飲みを両手で包んだ。

「でも目が覚めると……その名前が出てこないんだとさ」

ミレイの眉が、わずかに動いた。

「それは……誰の声だったか、覚えているんですか？」

「いいや」

老婆は首を横に振った。

「わからないのよ。
　声だけが耳に残ってね……。
　誰だったのかも、何を言われたのかも、うまく思い出せない」

老婆は、しばらく黙って茶を見つめた。

「……あたしにもねえ、大切な人がいたんだよ。
　顔も覚えてる。
　声も覚えてる。
　どんな人だったかだって、ちゃんと覚えてる」

老婆の指が、湯飲みの縁をゆっくりとなぞる。

「なのに、名前だけが出てこなくなったのさ」

「……名前だけ？」

「そう。何度思い出そうとしても、そこだけぽっかり抜けている」

老婆は壁際の古い杖へ、一瞬だけ目を向けた。

「おかしな話だろう？
　一緒に過ごして、何度も呼んだ名前のはずなのにねえ」

老婆は小さく笑う。

「まじないさえあれば、どうにかできると思ってたんだけどね。
　悪い夢を遠ざけたり、眠れない子を寝かせたり。
　そういうことなら、長いことやってきたから」

「……今は？」

老婆は少し考えるように目を伏せた。

「あたしの手には負えないんだろうねえ……」

それだけ言って、老婆は茶をすすった。
ミレイは返す言葉を見つけられない。

ふと、外から子供のはしゃぐ声が聞こえた。

「……いーち、にーい、さーん！」

道端で、かくれんぼをしているのだろうか。
ミレイは立ち上がり、窓のほうへ向かう。

「名前呼んだら、負けだからね！」
「影、くるよ！」

「影？」と、ミレイは思わず声をかけた。

数えていた男の子が振り返る。
男の子は首をかしげながらも、こう答えてくれた。

「うん。じいちゃんが言ってたの。
　昔ね、“名前を呼んだら、影が来る”って」

「どんな影なの？」

男の子は少し考える。

「目がないの。
　真っ黒で、大きくて、空から落ちてきた竜の……なにか」

子供の言葉とは思えない、妙に具体的な描写だった。
背後から、老婆の声がする。

「古い話さ」

ミレイが振り返る。
老婆はすっと目を細め、付け加えた。

「このあたりの山の中、もう場所も分からないけど、あたしの祖母が言ってたのよ。
　“名を喰らう竜が落ちた。そのそばに封を置いた”って」

名前。

ミレイの心のどこかが、さざ波のように揺れた。

（……影……空から落ちた竜……）

ミレイはしばらく黙って山を見つめていた。

＊

日が沈むころ、宿の部屋でふたりは並んで腰を下ろしていた。

「――おばあちゃんも言っていたの。
　昔、名を喰らう竜が落ちて、それを封じたって話」

「そういえば、西に向かう道とは別に、昔の道があったらしいな」

クラウスは地図を広げ直し、森の奥のほうを指で示した。

「これって、どこに続いているんです？」

「いや、どこにも繋がっていない。
　ルニアやネリアとも逆の方面だし」

ミレイが顔を上げる。

「……繋がってない？」

「ああ。もしかすれば廃城だとか、古い遺跡だとかはあるかもしれないが。
　道が残ってるだけで、使う人間はいないそうだ」

ミレイはもう一度、地図の上に置かれたクラウスの指先をじっと見つめた。

「わたし、行ってみます」

「……勘で突っ込む気か」

クラウスは、呆れたような声を出しながらも。

「なら、俺も行く。
　ただ、行くなら朝早くからにしよう。
　森の中で日が暮れると、厄介だからな」

「……野営するつもりはありませんよ」

「なら、明るいうちに必ず戻る。
　無茶はしない。
　そこは、決めておこう」

「分かりました」

＊

その夜。
ミレイは眠りの中で、なにかの声を聞いた。

鼓膜を揺らすような微かな音。
静けさの底にぽつりと落ちた、それは呼びかけだった。

「……＿＿＿」

誰かの声。
知っているような、知らないような。
けれど耳の奥で響いたその声は、何より――自分の“名前”を、確かに呼んでいた。
    ` }

  <div class="wrap">
    <header>
      <h1 id="h-title">読み込み中…</h1>
      <div class="sub" id="h-sub"></div>
    </header>

    <section class="panel">
      <div class="audio" id="audio-wrap"></div>
    </section>

    <section class="panel" id="content-wrap"></section>

    <footer class="nav" id="nav">
      <a id="prev" class="btn" href="#" aria-disabled="true">← 前の話</a>
      <a id="index" class="btn" href="#">目次へ</a>
      <a id="next" class="btn" href="#" aria-disabled="true">次の話 →</a>

  <script>
    (function init(){
      const hTitle = document.getElementById('h-title');
      const hSub = document.getElementById('h-sub');
      const audioWrap = document.getElementById('audio-wrap');
      const artWrap = document.getElementById('art-wrap');
      const beforeWrap = document.getElementById('before-wrap');
      const afterWrap = document.getElementById('after-wrap');

      hTitle.textContent = `${META.no}｜${META.title}`;
      hSub.textContent = META.id;

      if (META.audio) {
        let credit = '';
        if (META.audioCredit) {
          if (META.audioCredit.url) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                <a href="${escapeAttr(META.audioCredit.url)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(META.audioCredit.name)}
                </a>
              </span>`;
          } else if (META.audioCredit.name) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                ${escapeHtml(META.audioCredit.name)}
              </span>`;
          }
        }
        audioWrap.innerHTML = `<div>BGM${credit}</div><audio src="${escapeAttr(META.audio)}" controls controlsList="nodownload noplaybackrate" preload="metadata" loop></audio>`;
        const audio = audioWrap.querySelector("audio");
        audio.volume = 0.5; // 50%
      } else {
        audioWrap.textContent = '（BGM なし）';
      }

    const contentWrap = document.getElementById('content-wrap');

    if (Array.isArray(META.blocks)) {
      META.blocks.forEach(block => {
        if (block.type === 'time') {
          const panel = document.createElement('section');
          panel.className = 'panel time';
          const div = document.createElement('div');
          div.className = 'time-label';
          div.textContent = block.value || '';
          panel.appendChild(div);
          contentWrap.appendChild(panel);
        }

        if (block.type === 'location') {
          const panel = document.createElement('section');
          panel.className = 'panel location';
          const h = document.createElement('div');
          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
