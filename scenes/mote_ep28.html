  <style>
    :root { --bg:#0f1320; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; }
    html, body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }

  <script>
    function setFontSize(size) {
    const root = document.documentElement;
    if (size === 'large') {
      root.style.setProperty('--font-body', '1.25rem');
      root.style.setProperty('--line-body', '2.1');
      localStorage.setItem('fontSize', 'large');
    } else if (size === 'small') {
      root.style.setProperty('--font-body', '0.9rem');
      localStorage.setItem('fontSize', 'small');
    } else {
      root.style.setProperty('--font-body', '1rem');
      localStorage.setItem('fontSize', 'normal');
    }
  }
  (function(){
    const saved = localStorage.getItem('fontSize');
    if (saved === 'large') {
      document.documentElement.style.setProperty('--font-body', '1.25rem');
      document.documentElement.style.setProperty('--line-body', '2.1');
    } else if (saved === 'small') {
      document.documentElement.style.setProperty('--font-body', '0.9rem');
    }
  })();
  const META = {
    id: 'mote_ep28',
    no: '第28話',
    title: '帰路の岐路（きろ）',
    audio: '../assets/Code_of_Honor_2.mp3',

        title: 'グラン地中海 / Gran Mediterranean Sea',
        subtitle: '' },
      { type: 'text', content: `
昼下がりの海は、風がよく通る。
甲板に出る者はまばらで、静かな帆音と水音だけが響いていた。

ミレイはひとり、船縁近くに腰を下ろし、膝の上で小さな帳面を開いていた。
羊皮紙に細いペン先で文字を綴っている。

「……また書いてるのか」

クラウスの声に気づいたミレイは一瞬手を止めたが、顔は上げずに答えた。

「ええ。
　旅の記録。地名、日付、出来事。
　……それだけ」

クラウスは彼女の隣に腰を下ろし、そっと風を避けるように背を丸める。

「書かないのか？
　……感じたこととか、思ったこと」

ミレイは短く笑った。
けれど、その目はどこか遠い。

「書けたら楽でしょうね。
　……でも、書けないの。たぶん、最初から」

「どうして」

「――記してしまえば、それは“ここ”の事になるから」

クラウスが言葉を失ったことに、ミレイは気づいていた。
でも、それでよかった。
聞かれないことのなかに、救われるものがある。

「……ただ、
　誰にも話さないまま消えてしまうのも、怖い。
　だから書いてる。
　せめて、自分には残したいから」

クラウスは視線を水面に向けたまま、やわらかく言った。

「それでいいと思う。
　話せないことがあるのは、誰にでもある」

それきりふたりは何も言わなかった。
けれど風は少しだけ温く、陽は背中を照らしていた。

“この人は、聞いてこない”
――それが、どれだけ楽だったか。

“この人は、わかっていないふりをしてくれる”
――それが、どれほど優しかったか。

＊

――船はとうに港を離れ、今はただ、静かな夜の道を進んでいた。

波の揺れが船体を撫でる。
クラウスは甲板の端に立ち、月明かりの海を眺めていた。

「……眠れないんですか？」

背後から声がした。

振り返ると、ミレイが佇んでいた。
夜風に煽られる銀髪を、片手でそっと押さえている。

「お前こそ」

「わたしは……ちょっと、夜風にあたりたくて」

ミレイは少し肩をすくめて、すぐに目を伏せた。

もう片方の手には、古びた紙が握られていた。
その紙の端は、ところどころ指に擦れて柔らかくなっていた。

「それは？」

ミレイは紙に視線を落とした。

「……昔のもの。
　捨ててしまおうとも思ったんだけど……結局、できなくて」

ミレイの声が、夜に紛れる。
月明かりに照らされた銀の瞳が、わずかに潤んで見えた。
その紙には、家族からの言葉が書かれているのかもしれない。
あるいは、もう会えない家族の名が記されていたのかもしれない。

「どこかで、まだ戻れると思っていた。
　誰にも見られないところで、”あの頃の自分”に戻れる気がしてたの」

その呟きに、クラウスは何も言えなかった。

「でも……少しずつ、思い出せなくなってるの。
　あのときの空気も、音も……昔はもっと、はっきり覚えていたのに。
　今はもう、遠く霞んで……手を伸ばしたって届かない」

指先が震えていた。
それを、風のせいにしようとするように、ミレイはケープの裾を強く握りしめる。

「それでも……弱さは見せられない。
　わたしは、“強いふり”をしなきゃいけないから」

彼女は笑ってみせた。
でもその笑みは、夜の寒さのように、静かで儚かった。

＊

その紙には、ボールペンの走り書きでこうあった。

「夕飯は冷蔵庫の中にあります。
　温めて食べてね。　母より」

そこには、魔術も呪いも戦争もない、ただ平穏な世界の空気が染みついている。
目を閉じても、まぶたの裏に残るのは、あのキッチンの白い光景。

ミレイは無言でそれを見つめると、折りたたんで、また丁寧にしまう。

（帰れない。でも、捨てられない。
　あの日常を忘れてしまったら、自分はもう本当に“こちらの人間”になってしまうから）

＊

船は静かに揺れていた。
波が船体をなぞるたび、わずかにきしむ音が夜の空気に溶けていく。

ミレイは、寄りかかるようにクラウスの肩に頭を預けていた。
小さく呼吸を整え、やがてその瞼がすとんと落ちる。

その重みは軽いのに、不思議と心の奥にずしりと響いた。

クラウスは動かず、ただじっと彼女の気配を感じていた。

「……強い人だと思ってた」

なんてひどい勘違いをしていたんだろう。
夜の闇に溶けるように、彼は小さく呟く。

「冷たくて、誰の助けも借りずに戦って。
　……孤高のまま、ずっと前を歩いていく、そういう人なのかと思ってた」

月明かりが甲板を照らし、海の上に光の細道を描いていた。

「けど違ったんだ。お前は、痛みも抱えてた。
　脆くて、でも折れない……」

ふっと、風が吹いた。
ミレイの銀髪が揺れ、クラウスの肩にさらりと触れた。

風に吹かれて、肩をすくめて立っていたあの背中は、強さじゃなく、壊れそうな何かを必死に守っていたんだ。

誰にも見せないように包み込んで。
感情を隠して、過去を隠して。
鎧じゃない服で、ずっと心を隠してきた。

それでもあいつは、折れなかった。
俺みたいに怒りで誤魔化すことも、
誰かにすがることもできずに、ただ前を向いて歩いてた。

「……本当は、聞いてやりたい。
　何が書かれていたのか、誰を思っていたのか」

クラウスは目を伏せ、小さく息を吐く。

「でも――それを聞いたら、たぶん、お前はもう笑わなくなる気がしたんだ」

静かに、ただそのまま。

「だから、聞かない。
　……こんなの、俺の勝手な優しさだけどな」

ミレイは何も言わない。
ただ月明かりのもとで、静かに眠っているように見える。
けれど、彼女の長い睫毛が、一度だけわずかに揺れた。

それにクラウスは気づいたのか、気づかなかったのか。
ただ夜の深さのなかで、彼は静かに、肩に預けられた温もりをそのままに、目を閉じた。

そして、船はなおも、静かに北へ向かって進んでいた。

＊

朝陽が、波間を金色に染めていた。
穏やかな潮風が甲板を撫で、夜の湿り気をさらってゆく。

ミレイは、ゆっくりと目を覚ました。
すぐ隣にいるクラウスの肩に、まだ自分の頭が預けられていることに気づいて。

「あ……」

わずかに身を起こしながら、ミレイは小さく息を吐いた。
髪が少し乱れているのを指先で整え、ちらりとクラウスを見る。

「……おはようございます」

それは、いつも通りの落ち着いた声。
けれど、その頬にはほんのわずか、寝起きの熱が残っていた。

クラウスもすでに目を覚ましていたようで、ぎこちなく視線を逸らしながら返す。

「おはよう。……よく、眠れたか」

「ええ。おかげさまで」

言葉は少ない。
けれど、静かに伝わってくるものがあった。
“おかげ”が何を指すか――互いにわかっていて、あえて口にはしなかった。

少しの沈黙。

甲板の端から、水夫たちが声をかけ合うのが聞こえてくる。
帆が風を受け、船がわずかに揺れた。

「……あと数刻もあれば、波止場が見えるらしい」

クラウスが何気なく言った。

「そう。戻るのね、また……」

ミレイもそれに応じたが、その声の奥にある何かは、どちらも言葉にしなかった。

クラウスは何か言いかけて、けれどやめた。
そして、代わりに――

「……よく晴れてるな。今日は」

ミレイは少し驚いたように彼を見たあと、ふっと笑みを浮かべた。

「ええ。……本当に」

やがて二人は朝の水面を見つめる。
言葉は少ない。
わずかに気まずく、けれどそれを壊さぬように包む、優しい気配。

船は、光をかき分けながら進んでいく。

戻れない場所はある。
でも、進める場所も、ひとつくらいなら――

  <div class="wrap">
    <header>
      <h1 id="h-title">読み込み中…</h1>
      <div class="sub" id="h-sub"></div>
    </header>

    <section class="panel">
      <div class="audio" id="audio-wrap"></div>
    </section>

    <section class="panel" id="content-wrap"></section>

    <footer class="nav" id="nav">
      <a id="prev" class="btn" href="#" aria-disabled="true">← 前の話</a>
      <a id="index" class="btn" href="#">目次へ</a>
      <a id="next" class="btn" href="#" aria-disabled="true">次の話 →</a>
    </footer>

  <script>
    (function init(){
      const hTitle = document.getElementById('h-title');
      const hSub = document.getElementById('h-sub');
      const audioWrap = document.getElementById('audio-wrap');
      const artWrap = document.getElementById('art-wrap');
      const beforeWrap = document.getElementById('before-wrap');
      const afterWrap = document.getElementById('after-wrap');

      hTitle.textContent = `${META.no}｜${META.title}`;
      hSub.textContent = META.id;

      if (META.audio) {
        let credit = '';
        if (META.audioCredit) {
          if (META.audioCredit.url) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                <a href="${escapeAttr(META.audioCredit.url)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(META.audioCredit.name)}
                </a>
              </span>`;
          } else if (META.audioCredit.name) {
            credit = `
              <span class="audio-credit">｜ 音楽：
                ${escapeHtml(META.audioCredit.name)}
              </span>`;
          }
        }
        audioWrap.innerHTML = `<div>BGM${credit}</div><audio src="${escapeAttr(META.audio)}" controls controlsList="nodownload noplaybackrate" preload="metadata" loop></audio>`;
        const audio = audioWrap.querySelector("audio");
        audio.volume = 0.5; // 50%
      } else {
        audioWrap.textContent = '（BGM なし）';
      }

    const contentWrap = document.getElementById('content-wrap');

    if (Array.isArray(META.blocks)) {
      META.blocks.forEach(block => {
        if (block.type === 'time') {
          const panel = document.createElement('section');
          panel.className = 'panel time';
          const div = document.createElement('div');
          div.className = 'time-label';
          div.textContent = block.value || '';
          panel.appendChild(div);
          contentWrap.appendChild(panel);
        }

        if (block.type === 'location') {
          const panel = document.createElement('section');
          panel.className = 'panel location';
          const h = document.createElement('div');
          h.className = 'location-title';
          h.textContent = block.title || '';
          panel.appendChild(h);

          if (block.subtitle) {
            const s = document.createElement('div');
            s.className = 'location-sub';
            s.textContent = block.subtitle;
            panel.appendChild(s);
          }
          contentWrap.appendChild(panel);
        }
        if (block.type === 'text') {
        const div = document.createElement('div');
        div.className = 'caption';
        div.innerHTML = renderText(block.content);
        contentWrap.appendChild(div);
        }

        if (block.type === 'image') {
          const fig = document.createElement('figure');
          fig.className = 'art';
          fig.innerHTML = `<img src="${escapeAttr(block.src)}">`;
          contentWrap.appendChild(fig);
        }
      });
    }

      // ナビゲーション
      const aPrev = document.getElementById('prev');
      const aNext = document.getElementById('next');
      const aIndex = document.getElementById('index');

      if (META.prevHref) { aPrev.href = META.prevHref; aPrev.removeAttribute('aria-disabled'); }
      else { aPrev.setAttribute('aria-disabled','true'); aPrev.removeAttribute('href'); }
      if (META.nextHref) { aNext.href = META.nextHref; aNext.removeAttribute('aria-disabled'); }
      else { aNext.setAttribute('aria-disabled','true'); aNext.removeAttribute('href'); }

      aIndex.href = META.indexHref || '../index.html';
    })();

    function renderText(raw = '') {
      return escapeHtml(raw)
        .replace(/\[i\]([\s\S]+?)\[\/i\]/g, '<em class="chant">$1</em>')
        .replace(/\[b\]([\s\S]+?)\[\/b\]/g, '<strong>$1</strong>')
        .replace(/\[think\]([\s\S]+?)\[\/think\]/g, '<span class="think">$1</span>');
    }

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function escapeAttr(str=''){ return escapeHtml(str).replaceAll('"','&quot;'); }
  </script>
