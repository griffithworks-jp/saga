<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <title>用語集・設定資料 | ガルレリアンサーガ</title>
  <style>
    :root { --bg:#0f1320; --ink:#e7ebff; --muted:#a6b0d4; --border:#2a3147; --accent:#6ea8fe; }
    html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 18px 14px 28px; }
    header h1 { margin:0 0 6px; font-size: 1.3rem; }
    header p { margin:0 0 10px; color:var(--muted); }

    .tools { display:flex; gap:8px; align-items:center; margin:10px 0 14px; }
    .tools input[type="search"] { flex:1; min-width:160px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0e1430; color:var(--ink); }
    .tools a { padding:10px 12px; border-radius:999px; border:1px solid var(--border); background:#11162a; color:var(--ink); text-decoration:none; }
    .tools a:hover { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,168,254,.15) inset; }
    .card { background: linear-gradient(180deg, #1a1f33, #151a2a); border:1px solid var(--border); border-radius:12px; padding: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
    .card + .card { margin-top: 12px; }

    .entry { display:grid; grid-template-columns: 220px 1fr; gap:12px; }
    @media (max-width: 720px){ .entry { grid-template-columns: 1fr; } }

    .term { font-weight:700; font-size:1rem; }
    .reading { color:var(--muted); font-size:.9rem; }
    .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .tag { font-size:.75rem; color:#b9c3ff; background:#11162a; border:1px solid var(--border); padding:2px 6px; border-radius:999px; }
    .first { margin-top: 6px; font-size: .82rem; color: var(--muted); line-height: 1.5; }
    .first a { color: var(--accent); text-decoration: none; }
    .first a:hover { text-decoration: underline; }
    .def-toggle {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      user-select:none;
      padding: 2px 0;
      outline: none; }
    .def-toggle:focus-visible { box-shadow: 0 0 0 2px rgba(110,168,254,.25) inset; border-radius: 8px; }
    .def-toggle .label { color: var(--muted); font-size: .88rem; }
    .def-toggle .chev {
      color: var(--muted);
      font-size: .9rem;
      transform: translateY(1px);
      opacity: .9;
      white-space: nowrap; }

    .def {
      display:none;
      margin-top: 6px;
      line-height:1.7;
      white-space: pre-wrap;
      color: var(--muted); }
    .card.open .def { display:block; }
    .card.open .def-toggle .chev { transform: rotate(180deg) translateY(-1px); }
    .alpha { display:flex; gap:6px; flex-wrap:wrap; margin: 4px 0 10px; }
    .alpha a { padding:6px 8px; border:1px solid var(--border); border-radius:8px; text-decoration:none; color:var(--ink); }
    .alpha a:hover { border-color: var(--accent); }
    .group-title { margin: 16px 0 8px; font-size: 1rem; color: var(--muted); }

    /* 概要は常時表示 */
    .summary { line-height:1.7; white-space: pre-wrap; color: var(--muted); }

    /* 詳細（折りたたみ） */
    .detail-toggle{
      margin-top: 8px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      cursor:pointer; user-select:none;
      padding: 6px 8px;
      border:1px dashed var(--border);
      border-radius:10px;
      color: var(--muted);
      font-size:.86rem;
    }
    .detail-toggle:hover{ border-color: var(--accent); }
    .detail-toggle:focus-visible{ outline:none; box-shadow: 0 0 0 2px rgba(110,168,254,.25) inset; }
    .detail{ display:none; margin-top: 8px; line-height:1.7; white-space: pre-wrap; color: var(--muted); }
    .card.open-detail .detail{ display:block; }
    .card.open-detail .detail-toggle .chev{ transform: rotate(180deg); }

  </style>
</head>

    function escapeHtml(str=''){ return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }

    function deriveInitial(s){
      if (!s) return '#';
      const ch = s.trim()[0];
      if (/^[A-Za-z0-9]$/.test(ch)) return ch.toUpperCase();
      const hira = ch.replace(/[ァ-ン]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
      const groups = {
        'あ': /[あいうえお]/, 'か': /[かきくけこ]/, 'さ': /[さしすせそ]/, 'た': /[たちつてと]/,
        'な': /[なにぬねの]/, 'は': /[はひふへほ]/, 'ま': /[まみむめも]/, 'や': /[やゆよ]/,
        'ら': /[らりるれろ]/, 'わ': /[わをん]/
      };
      for (const k of Object.keys(groups)) { if (groups[k].test(hira)) return k; }
      return '#';
    }

    function groupByInitial(items){
      const map = {};
      items.forEach(t => {
        const initial = (t.initial || deriveInitial(t.term || t.reading || '？')).toUpperCase();
        if (!map[initial]) map[initial] = [];
        map[initial].push(t);
      });
      return map;
    }

    function firstLineHtml(t){
      if (!t.firstWork && !t.firstEpisode) return '';
      const label = `${escapeHtml(t.firstWork || '')}${t.firstWork && t.firstEpisode ? ' ' : ''}${escapeHtml(t.firstEpisode || '')}`.trim();
      if (!label) return '';
      if (t.firstHref) {
        return `<div class="first">初出：<a href="${escapeHtml(t.firstHref)}">${label}</a></div>`;
      }
      return `<div class="first">初出：${label}</div>`;
    }

    function renderList(items){
      const host = document.getElementById('list');
      items.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = t.anchor || t.id || '';

        const summary = (t.summary ?? '').toString();
        const detail = (t.detail ?? '').toString();

        card.innerHTML = `
          <div class="entry">
            <div>
              <div class="term">${escapeHtml(t.term)}</div>
              ${t.reading ? `<div class="reading">${escapeHtml(t.reading)}</div>` : ''}
              ${Array.isArray(t.tags) && t.tags.length ? `<div class="tags">${t.tags.map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join('')}</div>` : ''}
              ${firstLineHtml(t)}
            </div>

            <div>
              <div class="summary">${escapeHtml(summary)}</div>

              ${detail ? `
                <div class="detail-toggle" role="button" tabindex="0" aria-expanded="false">
                  <span class="label">詳細（設定資料）を表示</span>
                  <span class="chev">▼</span>
                </div>
                <div class="detail">${escapeHtml(detail)}</div>
              ` : ''}
            </div>
          </div>
        `;

        if (detail) {
          const toggle = card.querySelector('.detail-toggle');
          const label = toggle.querySelector('.label');

          function setOpen(open){
            card.classList.toggle('open-detail', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            label.textContent = open ? '詳細を折りたたむ' : '詳細（設定資料）を表示';
          }

          toggle.addEventListener('click', () => setOpen(!card.classList.contains('open-detail')));
          toggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              setOpen(!card.classList.contains('open-detail'));
            }
          });
        }

        host.appendChild(card);
      });
    }

    function renderAlphaIndex(items){
      const alphaHost = document.getElementById('alpha');
      alphaHost.innerHTML = '';
      const listHost = document.getElementById('list');
      listHost.innerHTML = '';

      const groups = groupByInitial(items);
      Object.keys(groups).sort().forEach(key => {
        const a = document.createElement('a');
        a.href = `#g-${encodeURIComponent(key)}`;
        a.textContent = key;
        alphaHost.appendChild(a);
      });

      Object.keys(groups).sort().forEach(key => {
        const h = document.createElement('div');
        h.className = 'group-title';
        h.id = `g-${key}`;
        h.textContent = key;
        listHost.appendChild(h);
        renderList(groups[key]);
      });
    }

    (function init(){
      let all = TERMS;
      let current = all;
      renderAlphaIndex(current);
      const q = document.getElementById('q');
      q.addEventListener('input', () => {
        const key = q.value.trim().toLowerCase();
        current = !key ? all : all.filter(t => {
          // 折り畳みも検索対象に含める
          //const hay = `${t.term||''} ${t.reading||''} ${t.summary||t.definition||''} ${t.detail||''} ${t.firstWork||''} ${t.firstEpisode||''}`.toLowerCase();
          const hay = `${t.term||''} ${t.reading||''} ${t.firstWork||''} ${t.firstEpisode||''}`.toLowerCase();
          return hay.includes(key);
        });
        renderAlphaIndex(current);
      });
    })();
  </script>
